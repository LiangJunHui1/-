<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体重记录表 - 梁 / 滕 / 乔</title>
    <!-- 移除外部依赖以提速：内置字体栈与自绘图表 -->
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Roboto, Arial, sans-serif;
            background: #f5f7fb;
            margin: 0; padding: 24px;
            color: #1f2330;
        }
        .container {
            max-width: 1100px; margin: 0 auto;
            background: #fff; border-radius: 16px;
            box-shadow: 0 16px 40px rgba(31,35,48,0.08);
            /* 取消 overflow 限制，确保 sticky 生效 */
            overflow: visible;
        }
        .header { padding: 28px 28px 12px; border-bottom: 1px solid #eef0f6; text-align: center; }
        .title { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
        .sub { color: #667085; font-size: 13px; }
        .motto { margin-top: 8px; display: inline-block; padding: 6px 12px; border-radius: 999px; background: #f1f5ff; color: #3730a3; font-size: 12px; box-shadow: inset 0 0 0 1px #e5e9ff; }
        .presence { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,.06), inset 0 0 0 1px #eef0f6; font-size: 12px; color: #475467; }
        .presence .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 999px; box-shadow: 0 0 0 4px rgba(34,197,94,.15); }
        .presence .names { max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .presence .nick-edit { border: 1px solid #e5e7ef; border-radius: 8px; padding: 4px 8px; font-size: 12px; width: 120px; }
        .presence .toggle { margin-left: 8px; cursor: pointer; color: #6366f1; }
        .presence-panel { position: fixed; right: 16px; top: 16px; width: 280px; max-height: 60vh; overflow: auto; background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.12); border: 1px solid #eef0f6; padding: 12px; display: none; }
        .presence-panel.show { display: block; }
        .presence-item { display:flex; align-items:center; gap:8px; padding:6px 4px; border-bottom:1px dashed #f0f2f7; }
        .presence-item:last-child { border-bottom: none; }
        .badge { background:#eef2ff; color:#3730a3; border-radius: 999px; padding:2px 6px; font-size: 11px; }

        .tabs { display: flex; gap: 8px; padding: 14px 18px 0; border-bottom: 1px solid #eef0f6; }
        .tab-btn {
            appearance: none; border: 0; background: transparent; cursor: pointer;
            padding: 10px 14px; border-radius: 10px 10px 0 0;
            color: #667085; font-weight: 600; font-size: 14px;
        }
        .tab-btn.active { background: #eef2ff; color: #3730a3; box-shadow: inset 0 -2px 0 #6366f1; transition: all .2s ease; }
        .tab-btn:not(.active):hover { transform: translateY(-1px); background: #f2f4ff; }

        .content { padding: 18px; }
        .section { display: none; }
        .section.active { display: block; }

        .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; color: #475467; font-size: 13px; }
        .toolbar .range { font-variant-numeric: tabular-nums; }
        .toolbar button {
            padding: 8px 12px; border-radius: 10px; border: 1px solid #e4e7ef; background: #fff; cursor: pointer; color: #373a47;
        }
        .toolbar button:hover { background: #f3f4f8; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead { background: #f5f7ff; position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 0 #eef0f6; }
        th, td { text-align: center; padding: 10px 8px; border-bottom: 1px solid #eef0f6; }
        tr:nth-child(even) td { background: #fafbff; }
        tbody tr { transition: background-color .15s ease; }
        tbody tr:hover { background: #f0f3ff; }
        input[type="number"] {
            width: 100px; padding: 8px 10px; border-radius: 8px;
            border: 1.5px solid #d5d9e6; outline: none; font-variant-numeric: tabular-nums;
        }
        input[type="number"]:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); transform: translateY(-1px); transition: all .15s ease; }
        input[type="number"]:out-of-range { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }

        .chart-wrap { margin-top: 16px; background: #fff; border: 1px solid #eef0f6; border-radius: 12px; padding: 12px; overflow: hidden; }
        .chart-wrap.sticky { position: sticky; top: 0; z-index: 20; border-radius: 0 0 12px 12px; box-shadow: 0 6px 18px rgba(31,35,48,0.08); border-top: none; }
        .chart-wrap.sticky::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 10px; background: linear-gradient(#ffffff, rgba(255,255,255,0)); pointer-events: none; }
        .chart-title { font-size: 13px; color: #475467; margin: 0 0 8px; }
        .muted { color: #98a2b3; font-size: 12px; }

        .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #1f2330; color: #fff; padding: 10px 14px; border-radius: 10px; opacity: 0; pointer-events: none; transition: all .25s ease; box-shadow: 0 8px 24px rgba(0,0,0,.2); font-size: 13px; }
        .toast.show { opacity: 0.96; transform: translateX(-50%) translateY(0); }

        @media (max-width: 640px) {
            .toolbar { flex-direction: column; align-items: flex-start; gap: 6px; }
            input[type="number"] { width: 90px; }
        }
    </style>
    <script>
        // 日期范围：从 2025-11-03 起两个月
        const START_DATE = new Date('2025-11-03');
        const END_DATE = (() => { const d = new Date(START_DATE); d.setMonth(d.getMonth() + 2); d.setDate(d.getDate() - 1); return d; })();
        const PEOPLE = [
            { key: 'liang', label: '梁君辉', color: '#6366f1' },
            { key: 'teng',  label: '滕浠顺', color: '#22c55e' },
            { key: 'qiao',  label: '李乔', color: '#ef4444' },
        ];

        const weekdays = ['日','一','二','三','四','五','六'];

        function fmtDate(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth()+1).padStart(2,'0');
            const da = String(d.getDate()).padStart(2,'0');
            return `${y}-${m}-${da}`;
        }

        function dateRange(start, end) {
            const list = []; const cur = new Date(start);
            while (cur <= end) { list.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
            return list;
        }

        function storageKey(personKey) { return `weightRecords_${personKey}_${fmtDate(START_DATE)}_${fmtDate(END_DATE)}`; }

        function loadData(personKey) {
            try { return JSON.parse(localStorage.getItem(storageKey(personKey)) || '{}'); } catch { return {}; }
        }

        function saveData(personKey, data) {
            localStorage.setItem(storageKey(personKey), JSON.stringify(data));
        }

        function buildTable(person) {
            const dates = dateRange(START_DATE, END_DATE);
            const data = loadData(person.key);
            const tbody = document.createElement('tbody');

            dates.forEach(d => {
                const dateStr = fmtDate(d);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${dateStr}</td>
                    <td>${weekdays[d.getDay()]}</td>
                    <td>
                        <input type="number" step="0.1" min="60" max="100"
                               data-person="${person.key}" data-date="${dateStr}" value="${data[dateStr] ?? ''}" />
                    </td>
                `;
                tbody.appendChild(tr);
            });
            return tbody;
        }

        function buildSection(person) {
            const section = document.createElement('div');
            section.className = 'section';

            const toolbar = document.createElement('div');
            toolbar.className = 'toolbar';
            toolbar.innerHTML = `
                <div class="range">日期范围：${fmtDate(START_DATE)} 至 ${fmtDate(END_DATE)}（共 ${dateRange(START_DATE, END_DATE).length} 天）</div>
                <span class="muted">单位：kg（小数一位），有效范围：60–100</span>
                <span style="flex:1"></span>
                <button type="button" data-action="clear" data-person="${person.key}">清空本页记录</button>
                <button type="button" data-action="export" data-person="${person.key}">导出CSV</button>
                <button type="button" data-action="diagnose" style="background:#f0f4ff;color:#6366f1;">诊断同步</button>
            `;

            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>星期</th>
                        <th>${person.label}（kg）</th>
                    </tr>
                </thead>
            `;
            table.appendChild(buildTable(person));

            const chartWrap = document.createElement('div');
            chartWrap.className = 'chart-wrap sticky';
            chartWrap.innerHTML = `
                <div class="chart-title">${person.label} 的体重趋势</div>
                <canvas id="chart_${person.key}" height="180"></canvas>
                <div class="muted">提示：留空表示未记录，曲线会自动跳过。</div>
            `;

            section.appendChild(toolbar);
            section.appendChild(chartWrap);
            section.appendChild(table);
            return section;
        }

        function gatherSeries(personKey) {
            const inputs = Array.from(document.querySelectorAll(`input[data-person="${personKey}"]`));
            inputs.sort((a,b) => a.dataset.date.localeCompare(b.dataset.date));
            const labels = inputs.map(i => i.dataset.date);
            const values = inputs.map(i => i.value === '' ? null : Number(i.value));
            return { labels, values };
        }

        // 轻量原生 Canvas 折线图
        const charts = {};
        function renderChart(person, animate = false) {
            const canvas = document.getElementById(`chart_${person.key}`);
            if (!canvas) return;
            const DPR = Math.min(window.devicePixelRatio || 1, 2);
            const parentWidth = canvas.parentElement.clientWidth - 24;
            const displayW = Math.max(480, parentWidth);
            const displayH = 180;
            canvas.style.width = displayW + 'px';
            canvas.style.height = displayH + 'px';
            canvas.width = Math.floor(displayW * DPR);
            canvas.height = Math.floor(displayH * DPR);
            const ctx = canvas.getContext('2d');
            ctx.scale(DPR, DPR);

            const { labels, values } = gatherSeries(person.key);
            const padding = { left: 40, right: 10, top: 10, bottom: 26 };
            const W = displayW - padding.left - padding.right;
            const H = displayH - padding.top - padding.bottom;

            // 过滤非空取 min/max
            const nums = values.filter(v => v != null);
            let minY = Math.min(...nums);
            let maxY = Math.max(...nums);
            if (!isFinite(minY) || !isFinite(maxY)) { minY = 40; maxY = 100; }
            if (minY === maxY) { minY -= 1; maxY += 1; }
            const margin = (maxY - minY) * 0.08;
            minY -= margin; maxY += margin;

            // 横坐标位置仅由日期数量决定，与是否有数据无关，避免清空后全部重叠在一起
            function xAt(i) { return padding.left + i * (W / ((labels.length - 1) || 1)); }
            function yAt(v) { return padding.top + (H - (v - minY) / (maxY - minY) * H); }

            // 背景
            ctx.clearRect(0, 0, displayW, displayH);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, displayW, displayH);

            // 网格与坐标（Y 轴）
            ctx.strokeStyle = '#eef0f6';
            ctx.lineWidth = 1;
            const gridLines = 4;
            for (let i = 0; i <= gridLines; i++) {
                const y = padding.top + (H / gridLines) * i;
                ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(displayW - padding.right, y); ctx.stroke();
                const val = (maxY - (maxY - minY) * (i / gridLines)).toFixed(0);
                ctx.fillStyle = '#98a2b3'; ctx.font = '12px system-ui';
                ctx.fillText(val, 6, y + 4);
            }

            // X 轴：从 11-03 开始每 7 天一个刻度与标签
            const step = 7;
            const axisY = displayH - padding.bottom + 6;
            ctx.fillStyle = '#98a2b3'; ctx.font = '12px system-ui';
            ctx.strokeStyle = '#e5e7ef';
            for (let i = 0; i < labels.length; i += step) {
                const x = xAt(i);
                // 刻度
                ctx.beginPath(); ctx.moveTo(x, displayH - padding.bottom); ctx.lineTo(x, displayH - padding.bottom + 4); ctx.stroke();
                // 标签（MM-DD）
                const label = labels[i].slice(5); // 11-03
                const textW = ctx.measureText(label).width;
                ctx.fillText(label, x - textW/2, axisY + 12);
            }

            // 折线（无动画稳定绘制，自动跳过空值段）
            ctx.lineWidth = 2;
            ctx.strokeStyle = person.color;
            ctx.fillStyle = person.color + '22';

            let prevValid = null;
            ctx.beginPath();
            labels.forEach((d, i) => {
                const v = values[i];
                if (v == null) { prevValid = null; return; }
                const x = xAt(i); const y = yAt(v);
                if (prevValid == null) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                prevValid = [x, y];
            });
            ctx.stroke();

            // 悬浮高亮（仅绘制圆点，不重启动画）
            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const relX = (e.clientX - rect.left) * (displayW / rect.width);
                const idxFloat = (relX - padding.left) / (W / (labels.length - 1 || 1));
                const idx = Math.max(0, Math.min(labels.length - 1, Math.round(idxFloat)));
                const v = values[idx];
                // 先重绘基础曲线
                renderChart(person, false);
                if (v == null) return;
                const cx = xAt(idx); const cy = yAt(v);
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = person.color;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            };
            canvas.onmouseleave = () => renderChart(person, false);
        }

        // 简易防抖
        function debounce(fn, wait){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); }; }

        function attachEvents() {
            const onInput = debounce((target) => {
                const personKey = target.dataset.person;
                const date = target.dataset.date;
                // 校验范围：60–100kg
                if (!target.checkValidity()) {
                    if (typeof target.reportValidity === 'function') target.reportValidity();
                    toast('请输入 60–100 kg');
                    return;
                }
                const data = loadData(personKey);
                if (target.value === '') delete data[date]; else data[date] = target.value;
                saveData(personKey, data);
                if (window.cloudStorage && window.cloudStorage.save) {
                    window.cloudStorage.save(personKey, data).then(() => {
                        console.log('✅ 体重数据已同步到 CloudBase', personKey);
                    }).catch((e) => {
                        console.error('❌ 体重数据同步失败', personKey, e);
                        toast('同步失败，请检查网络');
                    });
                }
                const person = PEOPLE.find(p => p.key === personKey);
                renderChart(person);
                toast('已保存');
            }, 120);

            document.addEventListener('input', (e) => {
                if (e.target.matches('input[type="number"][data-person]')) {
                    onInput(e.target);
                }
            });

            // 失焦时若越界则自动夹紧到 [60,100]
            document.addEventListener('blur', (e) => {
                if (e.target && e.target.matches('input[type="number"][data-person]')) {
                    const target = e.target;
                    if (target.value === '') return;
                    let v = parseFloat(target.value);
                    if (Number.isNaN(v)) return;
                    if (v < 60) v = 60; if (v > 100) v = 100;
                    if (String(v) !== target.value) {
                        target.value = v.toFixed(1);
                        // 触发保存
                        const evt = new Event('input', { bubbles: true });
                        target.dispatchEvent(evt);
                    }
                }
            }, true);

            document.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const action = btn.dataset.action;
                const personKey = btn.dataset.person;
                if (action === 'clear') {
                    if (confirm('确定清空该页的所有记录吗？此操作不可撤销。')) {
                        saveData(personKey, {});
                        // 同步到 CloudBase
                        if (window.cloudStorage && window.cloudStorage.save) {
                            window.cloudStorage.save(personKey, {}).then(() => {
                                console.log('✅ 清空操作已同步到 CloudBase', personKey);
                            }).catch((e) => {
                                console.error('❌ 清空同步失败', personKey, e);
                            });
                        }
                        document.querySelectorAll(`input[data-person="${personKey}"]`).forEach(i => i.value = '');
                        const person = PEOPLE.find(p => p.key === personKey);
                        renderChart(person);
                        toast('已清空该页记录');
                    }
                }
                if (action === 'export') {
                    exportCSV(personKey);
                    toast('已导出 CSV');
                }
                if (action === 'diagnose') {
                    diagnoseCloudStorage(personKey);
                }
            });
        }

        async function diagnoseCloudStorage(personKey) {
            const id = docId(personKey);
            const results = [];
            results.push(`🔍 诊断 ${personKey}`);
            results.push(`文档ID: ${id}`);
            results.push(`环境ID: ${window.TCB_ENV_ID || '未设置'}`);
            results.push(`登录状态: ${window.loginStatus || '未知'}`);
            if (window.lastError) results.push(`❌ 错误: ${window.lastError}`);
            
            if (!window.db) {
                results.push('❌ CloudBase 未初始化');
                results.push('请检查：1) SDK 是否加载成功 2) 网络连接是否正常');
                alert(results.join('\n') + '\n\n详细日志请查看浏览器控制台（F12）');
                return;
            }
            
            try {
                await window.ready;
                results.push('✅ 登录成功');
                
                // 测试读取
                try {
                    const res = await window.db.collection('WeightRecord').doc(id).get();
                    results.push(`📖 读取测试: ${res.data && res.data.length > 0 ? '✅ 有数据' : '⚠️ 无数据'}`);
                } catch(e) {
                    results.push(`❌ 读取失败: ${e.message}`);
                    window.lastError = e.message;
                }
                
                // 测试写入
                try {
                    await window.db.collection('WeightRecord').doc(id).set({ personKey, records:{'test':'123'}, updatedAtMs: Date.now() });
                    results.push('✅ 写入测试: 成功');
                    
                    // 清理测试数据
                    setTimeout(async () => {
                        try {
                            const current = await window.cloudStorage.load(personKey);
                            await window.db.collection('WeightRecord').doc(id).set({ personKey, records:current, updatedAtMs: Date.now() });
                        } catch(e) {}
                    }, 1000);
                } catch(e) {
                    results.push(`❌ 写入失败: ${e.message}`);
                    window.lastError = e.message;
                }
            } catch(e) {
                results.push(`❌ 登录失败: ${e.message}`);
                window.lastError = e.message;
            }
            
            alert(results.join('\n') + '\n\n详细日志请查看浏览器控制台（F12）');
            console.log('诊断结果:', results);
        }

        function exportCSV(personKey) {
            const { labels, values } = gatherSeries(personKey);
            const rows = [['日期','体重(kg)']].concat(labels.map((d,i) => [d, values[i] ?? '']));
            const csv = rows.map(r => r.join(',')).join('\n');
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${personKey}_${fmtDate(START_DATE)}_${fmtDate(END_DATE)}.csv`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function scrollToTodayIfVisible(sectionEl) {
            const today = new Date();
            const todayStr = fmtDate(today);
            const row = sectionEl.querySelector(`input[data-date="${todayStr}"]`);
            if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function toast(msg) {
            let el = document.querySelector('.toast');
            if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
            el.textContent = msg; el.classList.add('show');
            clearTimeout(toast._t); toast._t = setTimeout(()=> el.classList.remove('show'), 900);
        }

        function init() {
            // 构建 Tabs
            const tabs = document.getElementById('tabs');
            const views = document.getElementById('views');
            PEOPLE.forEach((p, idx) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (idx===0 ? ' active' : '');
                btn.textContent = p.label;
                btn.dataset.target = p.key;
                tabs.appendChild(btn);

                const sec = buildSection(p);
                sec.id = `section_${p.key}`;
                if (idx===0) sec.classList.add('active');
                views.appendChild(sec);
            });

            tabs.addEventListener('click', (e) => {
                const btn = e.target.closest('.tab-btn');
                if (!btn) return;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const key = btn.dataset.target;
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById(`section_${key}`).classList.add('active');
                const person = PEOPLE.find(p => p.key === key);
                renderChart(person, false);
                scrollToTodayIfVisible(document.getElementById(`section_${key}`));
                // 更新在线状态当前Tab（TCB）
                try { if (window.updatePresenceTab) window.updatePresenceTab(key); } catch(e) {}
            });

            attachEvents();

            // 初次渲染所有图表
            PEOPLE.forEach(p => renderChart(p, false));
            // 定位到今天（若在范围内）
            scrollToTodayIfVisible(document.querySelector('.section.active'));

            // 窗口尺寸变化时，重绘当前可见图表
            window.addEventListener('resize', debounce(() => {
                const activeBtn = document.querySelector('.tab-btn.active');
                const key = activeBtn ? activeBtn.dataset.target : PEOPLE[0].key;
                const person = PEOPLE.find(p => p.key === key);
                renderChart(person, false);
            }, 120));

            // 云端订阅（LeanCloud）与首次拉取
            if (window.cloudStorage && window.cloudStorage.ready) {
                window.cloudStorage.ready.then(() => {
                    // 首次拉取合并
                    PEOPLE.forEach(async p => {
                        try {
                            const remote = await window.cloudStorage.load(p.key);
                            if (remote && typeof remote === 'object') {
                                saveData(p.key, remote);
                                const inputs = document.querySelectorAll(`input[data-person="${p.key}"]`);
                                inputs.forEach(input => { input.value = remote[input.dataset.date] ?? ''; });
                                renderChart(p, false);
                            }
                        } catch(e) {}
                    });
                    PEOPLE.forEach(p => {
                        window.cloudStorage.subscribe(p.key, (remote) => {
                            // 合并远端数据到本地与界面
                            saveData(p.key, remote || {});
                            const inputs = document.querySelectorAll(`input[data-person="${p.key}"]`);
                            inputs.forEach(input => {
                                const v = (remote || {})[input.dataset.date] ?? '';
                                if (input.value !== String(v)) input.value = v;
                            });
                            renderChart(p, false);
                        });
                    });
                    // 轮询兜底：即使 LiveQuery 不通也能看到他人数据
                    setInterval(async () => {
                        try {
                            for (const p of PEOPLE) {
                                const remote = await window.cloudStorage.load(p.key);
                                const cached = loadData(p.key) || {};
                                const changed = JSON.stringify(remote||{}) !== JSON.stringify(cached||{});
                                if (changed) {
                                    saveData(p.key, remote || {});
                                    const inputs = document.querySelectorAll(`input[data-person="${p.key}"]`);
                                    inputs.forEach(input => { input.value = (remote||{})[input.dataset.date] ?? ''; });
                                    renderChart(p, false);
                                }
                            }
                        } catch(e) {}
                    }, 15000);
                }).catch(()=>{});
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</head>

    <script>
        // 全局变量（供诊断函数使用）
        window.TCB_ENV_ID = 'cloud1-3g1ct7bc04d6c606';
        window.TCB_REGION = 'ap-shanghai';
        window.loginStatus = 'pending';
        window.lastError = null;
        window.app = null;
        window.auth = null;
        window.db = null;
        window.ready = null;

        // 使用 CloudBase Web 端官方 CDN（2.22.1 版本）
        const SDK_VERSION = '2.22.1';
        const SDK_URL = `https://static.cloudbase.net/cloudbase-js-sdk/${SDK_VERSION}/cloudbase.full.js`;

        function loadSDK() {
            if (typeof cloudbase !== 'undefined') {
                initCloudBase();
                return;
            }

            console.log(`📦 加载 CloudBase SDK: ${SDK_URL}`);
            const script = document.createElement('script');
            script.src = SDK_URL;
            script.onload = () => {
                console.log('✅ SDK 加载成功');
                initCloudBase();
            };
            script.onerror = () => {
                console.error('❌ SDK 加载失败，请检查网络连接');
                window.loginStatus = 'failed';
                window.lastError = 'SDK 加载失败：无法访问 CloudBase CDN';
                if (typeof toast === 'function') {
                    toast('CloudBase SDK 加载失败，请检查网络或刷新页面');
                }
            };
            document.head.appendChild(script);
        }

        // CloudBase 初始化（使用官方 cloudbase 对象）
        function initCloudBase() {
            if (typeof cloudbase === 'undefined') {
                console.error('❌ CloudBase SDK 未定义');
                window.loginStatus = 'failed';
                window.lastError = 'SDK 未定义';
                return;
            }
            
            try {
                console.log('🚀 初始化 CloudBase...', window.TCB_ENV_ID);
                window.app = cloudbase.init({ env: window.TCB_ENV_ID });
                window.auth = window.app.auth({ persistence: 'local' });
                window.db = window.app.database();
                console.log('✅ CloudBase 初始化完成，db 已设置');

                // 匿名登录（带诊断）
                window.ready = (async () => {
                    try {
                        // 调试：查看 auth 对象可用方法
                        console.log('🔍 Auth 对象方法:', Object.keys(window.auth).filter(k => typeof window.auth[k] === 'function'));
                        
                        // CloudBase SDK 2.x 匿名登录方式
                        let loginState;
                        if (typeof window.auth.signInAnonymously === 'function') {
                            // 方法 1: signInAnonymously() (SDK 2.x)
                            console.log('📝 使用方法: signInAnonymously()');
                            loginState = await window.auth.signInAnonymously();
                        } else if (typeof window.auth.signInAnonymous === 'function') {
                            // 方法 2: signInAnonymous() (备用)
                            console.log('📝 使用方法: signInAnonymous()');
                            loginState = await window.auth.signInAnonymous();
                        } else if (window.auth.anonymousAuthProvider && typeof window.auth.anonymousAuthProvider === 'function') {
                            // 方法 3: anonymousAuthProvider().signIn() (SDK 1.x)
                            console.log('📝 使用方法: anonymousAuthProvider().signIn()');
                            loginState = await window.auth.anonymousAuthProvider().signIn();
                        } else {
                            // 列出所有方法供调试
                            const methods = Object.keys(window.auth).filter(k => typeof window.auth[k] === 'function');
                            console.error('❌ 可用的 auth 方法:', methods);
                            throw new Error('匿名登录方法不可用，可用的方法: ' + methods.join(', '));
                        }
                        window.loginStatus = 'success';
                        console.log('✅ CloudBase 登录成功', loginState || window.auth.currentUser);
                        return true;
                    } catch(e) {
                        window.loginStatus = 'failed';
                        window.lastError = e.message || String(e);
                        console.error('❌ CloudBase 登录失败', e);
                        
                        // 尝试解析错误消息（可能是 JSON 字符串）
                        let errorMsg = e.message || String(e);
                        let errorCode = '';
                        try {
                            const errorObj = JSON.parse(errorMsg);
                            errorMsg = errorObj.msg || errorMsg;
                            errorCode = errorObj.code || '';
                        } catch(parseErr) {
                            // 如果不是 JSON，直接使用原消息
                        }
                        
                        // 检查是否是匿名登录未启用错误
                        const isAnonymousDisabled = errorCode === 'ACCESS_TOKEN_DISABLED' || 
                                                     errorMsg.includes('ACCESS_TOKEN_DISABLED') ||
                                                     errorMsg.includes('开启匿名登录');
                        
                        // 检查是否是 CORS 错误
                        const isCorsError = errorMsg.includes('CORS') || 
                                           errorMsg.includes('network request error') ||
                                           errorMsg.includes('Access-Control-Allow-Origin');
                        
                        if (isAnonymousDisabled) {
                            console.error(`⚠️ 匿名登录未启用：需要在 CloudBase 控制台开启匿名登录`);
                            console.error(`📝 配置步骤：`);
                            console.error(`   1. 登录 https://tcb.cloud.tencent.com/dev`);
                            console.error(`   2. 选择环境：${window.TCB_ENV_ID}`);
                            console.error(`   3. 进入「身份认证」→「登录方式」`);
                            console.error(`   4. 开启「匿名登录」`);
                            console.error(`   5. 确保已保存配置`);
                            
                            if (typeof toast === 'function') {
                                toast('需要在 CloudBase 控制台开启匿名登录', 10000);
                            }
                        } else if (isCorsError) {
                            const currentDomain = window.location.hostname;
                            console.error(`⚠️ CORS 跨域错误：需要在 CloudBase 控制台配置安全域名`);
                            console.error(`📍 当前域名：${currentDomain}`);
                            console.error(`📝 配置步骤：`);
                            console.error(`   1. 登录 https://console.cloud.tencent.com/tcb`);
                            console.error(`   2. 选择环境：${window.TCB_ENV_ID}`);
                            console.error(`   3. 进入「安全配置」→「安全域名」`);
                            console.error(`   4. 添加域名：${currentDomain}`);
                            
                            if (typeof toast === 'function') {
                                toast(`需要在 CloudBase 控制台配置安全域名：${currentDomain}`, 8000);
                            }
                        } else {
                            if (typeof toast === 'function') {
                                toast('CloudBase 连接失败：' + errorMsg);
                            }
                        }
                        return false;
                    }
                })();
            } catch(e) {
                window.loginStatus = 'failed';
                window.lastError = e.message || String(e);
                console.error('❌ CloudBase 初始化失败', e);
            }
        }

        // 开始加载 SDK
        if (typeof cloudbase !== 'undefined') {
            console.log('📦 SDK 已存在，直接初始化');
            initCloudBase();
        } else {
            console.log('⏳ 开始加载 SDK...');
            loadSDK();
        }

        function docId(personKey) {
            const s = window.START_DATE || new Date('2025-11-03');
            const e = window.END_DATE   || new Date('2026-01-02');
            const pad = n => String(n).padStart(2,'0');
            const f = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
            return `${personKey}_${f(s)}_${f(e)}`;
        }

        async function loadCloud(personKey) {
            try {
                if (!window.db) {
                    console.warn('⏳ 等待 CloudBase 初始化...');
                    let retries = 0;
                    while (!window.db && retries < 20) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        retries++;
                    }
                    if (!window.db) {
                        console.error('❌ CloudBase 未初始化');
                        return {};
                    }
                }
                await window.ready;
                const id = docId(personKey);
                console.log('📥 准备加载数据从 CloudBase 文档数据库:', {
                    collection: 'WeightRecord',
                    docId: id
                });
                const res = await window.db.collection('WeightRecord').doc(id).get();
                console.log('📥 查询结果:', res);
                const row = (res && res.data && res.data[0]) || null;
                if (row) {
                    console.log('✅ 加载成功，找到数据:', row);
                    return row.records || {};
                } else {
                    console.log('⚠️ 未找到数据，集合可能为空或文档不存在');
                    console.log('💡 提示：首次保存时 CloudBase 会自动创建集合「WeightRecord」');
                    return {};
                }
            } catch(e) {
                console.error('❌ 加载失败', personKey, e);
                return {};
            }
        }

        async function saveCloud(personKey, dataObj) {
            try {
                // 等待 CloudBase 初始化完成
                if (!window.db) {
                    console.warn('⏳ 等待 CloudBase 初始化...');
                    let retries = 0;
                    while (!window.db && retries < 20) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        retries++;
                    }
                    if (!window.db) {
                        throw new Error('CloudBase 初始化超时，请刷新页面重试');
                    }
                }
                
                await window.ready;
                const id = docId(personKey);
                // 注意：不要在 dataToSave 中包含 _id，因为已经在 doc(id) 中指定了文档 ID
                const dataToSave = { personKey, records:dataObj||{}, updatedAtMs: Date.now() };
                console.log('💾 准备保存数据到 CloudBase 文档数据库:', {
                    collection: 'WeightRecord',
                    docId: id,
                    data: dataToSave
                });
                
                // 保存数据
                const saveResult = await window.db.collection('WeightRecord').doc(id).set(dataToSave);
                console.log('💾 保存操作结果:', saveResult);
                
                // 验证：保存后立即读取验证
                await new Promise(resolve => setTimeout(resolve, 500)); // 等待 500ms 确保数据写入
                const verifyResult = await window.db.collection('WeightRecord').doc(id).get();
                console.log('🔍 验证读取结果:', verifyResult);
                
                if (verifyResult && verifyResult.data && verifyResult.data.length > 0) {
                    const savedData = verifyResult.data[0];
                    console.log('✅ 保存成功并验证通过！', personKey, id);
                    console.log('📊 已保存的数据:', savedData);
                    console.log('📝 请在 CloudBase 控制台查看数据：');
                    console.log('   1. 登录 https://console.cloud.tencent.com/tcb');
                    console.log('   2. 选择环境:', window.TCB_ENV_ID);
                    console.log('   3. 进入「数据库」→「文档数据库」');
                    console.log('   4. 查看集合「WeightRecord」');
                    console.log('   5. 文档 ID:', id);
                    console.log('   6. 如果看不到数据，请检查集合权限设置');
                } else {
                    console.warn('⚠️ 保存成功但验证读取失败，可能的原因：');
                    console.warn('   1. 集合权限不允许匿名用户读取');
                    console.warn('   2. 数据可能还在写入中（尝试刷新页面）');
                    console.warn('   3. 集合可能未创建（首次保存需要时间）');
                    console.log('✅ 保存操作完成（但验证失败）', personKey, id);
                }
            } catch(e) {
                window.lastError = e.message || String(e);
                console.error('❌ 保存失败', personKey, e);
                if (typeof toast === 'function') toast('保存失败：' + (e.message || '未知错误'));
            }
        }

        function subscribeCloud(personKey, cb) {
            if (!window.db) {
                console.error('❌ CloudBase 未初始化，无法订阅');
                return { stop: () => {} };
            }
            const id = docId(personKey);
            console.log('🔍 开始监听体重数据', personKey, id);
            
            // 先等待数据库初始化完成
            (async () => {
                try {
                    await window.ready;
                    
                    // 先查询一次获取最新数据
                    try {
                        const queryResult = await window.db.collection('WeightRecord').doc(id).get();
                        const docs = queryResult.data || [];
                        if (docs.length > 0) {
                            const doc = docs[0];
                            console.log('📥 初始加载体重数据', personKey, doc);
                            cb(doc.records || {});
                        }
                    } catch(e) {
                        console.warn('⚠️ 初始查询失败', personKey, e);
                    }
                    
                    // 开始监听实时更新（带错误处理和轮询回退）
                    let watchWatcher = null;
                    let pollTimer = null;
                    let watchRetries = 0;
                    const MAX_WATCH_RETRIES = 3;
                    
                    const startPolling = () => {
                        if (pollTimer) return; // 已在轮询中
                        console.log(`🔄 使用轮询方案更新体重数据 ${personKey}（每 5 秒）`);
                        pollTimer = setInterval(async () => {
                            try {
                                const queryResult = await window.db.collection('WeightRecord').doc(id).get();
                                const docs = queryResult.data || [];
                                if (docs.length > 0) {
                                    const doc = docs[0];
                                    console.log('📥 轮询获取体重数据', personKey, doc);
                                    if (doc.records) {
                                        cb(doc.records);
                                    } else if (doc) {
                                        cb(doc);
                                    }
                                }
                            } catch(e) {
                                console.warn('⚠️ 轮询失败', personKey, e);
                            }
                        }, 5000);
                    };
                    
                    const stopPolling = () => {
                        if (pollTimer) {
                            clearInterval(pollTimer);
                            pollTimer = null;
                        }
                    };
                    
                    const tryWatch = () => {
                        try {
                            watchWatcher = window.db.collection('WeightRecord').doc(id).watch({
                                onChange: snap => {
                                    stopPolling(); // watch 成功，停止轮询
                                    // CloudBase watch 返回的数据格式可能是 snap.docs 数组或单个文档对象
                                    let doc = null;
                                    if (snap.docs && snap.docs.length > 0) {
                                        doc = snap.docs[0];
                                    } else if (snap.doc) {
                                        doc = snap.doc;
                                    } else if (snap.data) {
                                        doc = snap;
                                    }
                                    
                                    console.log('📢 收到体重数据更新', personKey, doc);
                                    if (doc && doc.records) {
                                        cb(doc.records);
                                    } else if (doc) {
                                        // 可能是整个文档对象
                                        cb(doc);
                                    }
                                    watchRetries = 0; // 成功，重置重试次数
                                },
                                onError: err => {
                                    window.lastError = err.message || String(err);
                                    console.warn('⚠️ 体重数据 watch 错误, 切换到轮询方案:', personKey, err.message || err);
                                    watchRetries++;
                                    
                                    // 停止 watch
                                    if (watchWatcher && watchWatcher.close) {
                                        try {
                                            watchWatcher.close();
                                        } catch(e) {}
                                    }
                                    watchWatcher = null;
                                    
                                    // 如果重试次数过多，切换到轮询
                                    if (watchRetries >= MAX_WATCH_RETRIES) {
                                        console.log(`🔄 体重数据 watch 重试次数过多，切换到轮询方案: ${personKey}`);
                                        startPolling();
                                    } else {
                                        // 延迟后重试 watch
                                        setTimeout(() => {
                                            console.log(`🔄 重试体重数据 watch (${watchRetries}/${MAX_WATCH_RETRIES})... ${personKey}`);
                                            tryWatch();
                                        }, 2000);
                                    }
                                }
                            });
                            console.log(`✅ 体重数据 watch 连接成功: ${personKey}`);
                        } catch(e) {
                            console.error('❌ 体重数据 watch 初始化失败:', personKey, e);
                            watchRetries++;
                            if (watchRetries >= MAX_WATCH_RETRIES) {
                                console.log(`🔄 体重数据 watch 初始化失败次数过多，切换到轮询方案: ${personKey}`);
                                startPolling();
                            } else {
                                setTimeout(() => {
                                    console.log(`🔄 重试体重数据 watch (${watchRetries}/${MAX_WATCH_RETRIES})... ${personKey}`);
                                    tryWatch();
                                }, 2000);
                            }
                        }
                    };
                    
                    // 尝试启动 watch
                    tryWatch();
                    
                    // 如果 watch 在 10 秒内未成功，启动轮询作为备用
                    setTimeout(() => {
                        if (!watchWatcher && !pollTimer) {
                            console.log(`🔄 体重数据 watch 连接超时，启动轮询方案: ${personKey}`);
                            startPolling();
                        }
                    }, 10000);
                    
                    return watchWatcher || { stop: () => { stopPolling(); } };
                } catch(e) {
                    console.error('❌ 订阅失败', personKey, e);
                    return { stop: () => {} };
                }
            })();
            
            return { stop: () => {} }; // 返回一个空的 stop 函数，实际停止需要保存 watcher 引用
        }

        window.cloudStorage = { ready: window.ready, load: loadCloud, save: saveCloud, subscribe: subscribeCloud };

        // ===== 在线状态（Presence） =====
        const ROOM_ID = (() => {
            const s = window.START_DATE || new Date('2025-11-03');
            const e = window.END_DATE   || new Date('2026-01-02');
            const pad = n => String(n).padStart(2,'0');
            const f = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
            return `room_${f(s)}_${f(e)}`;
        })();
        const NICK = (() => { const k='presence_nick'; let v=localStorage.getItem(k); if(!v){ v='用户'+Math.floor(Math.random()*900+100); localStorage.setItem(k,v);} return v; })();
        let myPresenceId = null; let heartbeatTimer = null;
        window.myPresence = null;

        async function presenceUp() {
            try {
                // 等待数据库初始化完成
                if (!window.db) {
                    console.warn('⏳ 等待 CloudBase 初始化...');
                    let retries = 0;
                    while (!window.db && retries < 30) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        retries++;
                    }
                    if (!window.db) {
                        console.error('❌ CloudBase 未初始化，无法设置在线状态');
                        return;
                    }
                }
                
                await window.ready;
                const uid = window.auth.currentUser ? window.auth.currentUser.uid : ('anon_'+Math.random().toString(36).slice(2,8));
                const id = `${ROOM_ID}_${uid}`;
                const tab = document.querySelector('.tab-btn.active')?.dataset.target || 'liang';
                
                console.log('👤 设置在线状态:', { id, uid, nick: NICK, tab });
                await window.db.collection('Presence').doc(id).set({ roomId:ROOM_ID, userId:uid, nick:NICK, tab, since:Date.now(), lastSeen:Date.now() });
                myPresenceId = id; 
                window.myPresence = { id };
                console.log('✅ 在线状态设置成功:', myPresenceId);
                
                if (heartbeatTimer) clearInterval(heartbeatTimer);
                heartbeatTimer = setInterval(async ()=>{
                    try { 
                        await window.db.collection('Presence').doc(id).update({ lastSeen: Date.now() }); 
                    } catch(e) {
                        console.warn('心跳更新失败:', e);
                    }
                }, 20000);
            } catch(e) {
                console.error('❌ 设置在线状态失败:', e);
            }
        }

        function presenceRenderFromDocs(docs) {
            const now = Date.now();
            // 超时时间：30秒（如果用户关闭页面，心跳停止，30秒后自动从列表中消失）
            const TIMEOUT = 30000;
            const alive = (docs||[]).filter(p => (now - (p.lastSeen||0)) < TIMEOUT);
            const count = alive.length;
            const names = alive.map(p => p.nick || '用户').join('、');
            const cEl = document.getElementById('presenceCount');
            const nEl = document.getElementById('presenceNames');
            if (cEl) cEl.textContent = `${count} 在线`;
            if (nEl) nEl.textContent = names;
            const listEl = document.getElementById('presenceList');
            if (listEl) {
                listEl.innerHTML = '';
                alive.forEach(p => {
                    const item = document.createElement('div'); item.className = 'presence-item';
                    const dur = Math.max(0, Math.floor((now - (p.since||now))/1000));
                    const mm = String(Math.floor(dur/60)).padStart(2,'0'); const ss = String(dur%60).padStart(2,'0');
                    const tabLabel = p.tab==='liang' ? '梁君辉' : (p.tab==='teng' ? '滕浠顺' : (p.tab==='qiao' ? '李乔' : (p.tab||'')));
                    item.innerHTML = `<span class=\"dot\"></span><span>${p.nick||'用户'}</span><span class=\"badge\">${tabLabel}</span><span class=\"muted\">在线 ${mm}:${ss}</span>`;
                    listEl.appendChild(item);
                });
            }
        }

        async function presenceSubscribe() {
            try {
                // 等待数据库初始化完成
                if (!window.db) {
                    console.warn('⏳ 等待 CloudBase 初始化以开始监听...');
                    let retries = 0;
                    while (!window.db && retries < 30) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        retries++;
                    }
                    if (!window.db) {
                        console.error('❌ CloudBase 未初始化，无法监听在线状态');
                        return;
                    }
                }
                
                await window.ready;
                console.log('👂 开始监听在线状态，房间:', ROOM_ID);
                
                // 先查询一次当前数据
                try {
                    const queryResult = await window.db.collection('Presence').where({ roomId: ROOM_ID }).get();
                    const docs = queryResult.data || [];
                    console.log('📊 初始在线状态查询结果:', docs.length, '用户');
                    presenceRenderFromDocs(docs);
                } catch(e) {
                    console.warn('⚠️ 初始查询失败:', e);
                }
                
                // 然后开始监听实时更新（带错误处理和轮询回退）
                let watchWatcher = null;
                let pollTimer = null;
                let watchRetries = 0;
                const MAX_WATCH_RETRIES = 3;
                
                const startPolling = () => {
                    if (pollTimer) return; // 已在轮询中
                    console.log('🔄 使用轮询方案更新在线状态（每 5 秒）');
                    pollTimer = setInterval(async () => {
                        try {
                            const queryResult = await window.db.collection('Presence').where({ roomId: ROOM_ID }).get();
                            const docs = queryResult.data || [];
                            presenceRenderFromDocs(docs);
                        } catch(e) {
                            console.warn('⚠️ 轮询失败:', e);
                        }
                    }, 5000);
                };
                
                const stopPolling = () => {
                    if (pollTimer) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                    }
                };
                
                const tryWatch = () => {
                    try {
                        watchWatcher = window.db.collection('Presence').where({ roomId: ROOM_ID }).watch({
                            onChange: async snap => {
                                stopPolling(); // watch 成功，停止轮询
                                const docs = snap.docs || [];
                                console.log('📢 收到在线状态更新，用户数:', docs.length, docs);
                                
                                // 定期清理超时的在线状态（30秒未更新则删除）
                                const now = Date.now();
                                const TIMEOUT = 30000;
                                const expiredDocs = docs.filter(p => (now - (p.lastSeen||0)) >= TIMEOUT);
                                
                                if (expiredDocs.length > 0) {
                                    console.log('🧹 清理超时的在线状态:', expiredDocs.length, '个');
                                    for (const doc of expiredDocs) {
                                        try {
                                            if (doc._id || doc.id) {
                                                const docId = doc._id || doc.id;
                                                await window.db.collection('Presence').doc(docId).remove();
                                                console.log('✅ 已删除超时的在线状态:', docId);
                                            }
                                        } catch(e) {
                                            console.warn('⚠️ 删除超时状态失败:', e);
                                        }
                                    }
                                }
                                
                                presenceRenderFromDocs(docs);
                                watchRetries = 0; // 成功，重置重试次数
                            },
                            onError: err => {
                                console.warn('⚠️ presence watch error, 切换到轮询方案:', err.message || err);
                                watchRetries++;
                                
                                // 停止 watch
                                if (watchWatcher && watchWatcher.close) {
                                    try {
                                        watchWatcher.close();
                                    } catch(e) {}
                                }
                                watchWatcher = null;
                                
                                // 如果重试次数过多，切换到轮询
                                if (watchRetries >= MAX_WATCH_RETRIES) {
                                    console.log('🔄 watch 重试次数过多，切换到轮询方案');
                                    startPolling();
                                } else {
                                    // 延迟后重试 watch
                                    setTimeout(() => {
                                        console.log(`🔄 重试 watch (${watchRetries}/${MAX_WATCH_RETRIES})...`);
                                        tryWatch();
                                    }, 2000);
                                }
                            }
                        });
                        console.log('✅ watch 连接成功');
                    } catch(e) {
                        console.error('❌ watch 初始化失败:', e);
                        watchRetries++;
                        if (watchRetries >= MAX_WATCH_RETRIES) {
                            console.log('🔄 watch 初始化失败次数过多，切换到轮询方案');
                            startPolling();
                        } else {
                            setTimeout(() => {
                                console.log(`🔄 重试 watch (${watchRetries}/${MAX_WATCH_RETRIES})...`);
                                tryWatch();
                            }, 2000);
                        }
                    }
                };
                
                // 尝试启动 watch
                tryWatch();
                
                // 如果 watch 在 10 秒内未成功，启动轮询作为备用
                setTimeout(() => {
                    if (!watchWatcher && !pollTimer) {
                        console.log('🔄 watch 连接超时，启动轮询方案');
                        startPolling();
                    }
                }, 10000);
            } catch(e) {
                console.error('❌ 监听在线状态失败:', e);
            }
        }

        window.updatePresenceTab = async function(key){ 
            try { 
                if (myPresenceId && window.db) {
                    await window.db.collection('Presence').doc(myPresenceId).update({ tab: key, lastSeen: Date.now() }); 
                }
            } catch(e) {
                console.warn('更新标签失败:', e);
            }
        };

        // 删除在线状态（关闭页面时调用）
        async function removePresence() {
            if (!myPresenceId || !window.db) return;
            try {
                console.log('👋 删除在线状态:', myPresenceId);
                await window.db.collection('Presence').doc(myPresenceId).remove();
                console.log('✅ 在线状态已删除');
            } catch(e) {
                console.warn('❌ 删除在线状态失败:', e);
            }
        }

        // 使用多种方式确保页面关闭时删除在线状态
        // 方法1: visibilitychange - 当页面隐藏时（切换标签、最小化窗口等）
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                // 页面隐藏时，使用 sendBeacon 发送请求（同步）
                if (myPresenceId && navigator.sendBeacon) {
                    // 注意：CloudBase 不支持 sendBeacon，所以我们尝试异步删除
                    removePresence();
                }
            }
        });

        // 方法2: beforeunload - 页面卸载前（可能来不及执行异步操作）
        window.addEventListener('beforeunload', () => {
            // beforeunload 中异步操作可能无法完成，使用同步方式尝试
            if (myPresenceId && window.db) {
                // 尝试同步删除（如果可能）
                try {
                    // 注意：这可能在页面关闭前无法完成，但至少尝试了
                    window.db.collection('Presence').doc(myPresenceId).remove().catch(() => {});
                } catch(e) {}
            }
        });

        // 方法3: pagehide - 页面隐藏时（比 beforeunload 更可靠）
        window.addEventListener('pagehide', () => {
            removePresence();
        });

        // 启动在线状态功能（等待数据库初始化完成）
        (async () => {
            try {
                await window.ready;
                console.log('🚀 初始化在线状态功能...');
                await presenceUp();
                await presenceSubscribe();
            } catch(e) {
                console.error('❌ 初始化在线状态失败:', e);
            }
        })();

        // 昵称编辑
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('nickInput');
            if (input) {
                try { input.value = localStorage.getItem('presence_nick') || ''; } catch(e) {}
                input.addEventListener('change', async () => {
                    const v = input.value.trim() || '用户' + Math.floor(Math.random()*900+100);
                    localStorage.setItem('presence_nick', v);
                    try { 
                        if (myPresenceId && window.db) {
                            console.log('✏️ 更新昵称:', v, 'presenceId:', myPresenceId);
                            await window.db.collection('Presence').doc(myPresenceId).update({ nick: v, lastSeen: Date.now() });
                            console.log('✅ 昵称更新成功');
                        } else {
                            console.warn('⚠️ 无法更新昵称: myPresenceId=', myPresenceId, 'window.db=', !!window.db);
                        }
                    } catch(e) {
                        console.error('❌ 昵称更新失败:', e);
                    }
                });
            }
            const toggle = document.getElementById('presenceToggle');
            const panel = document.getElementById('presencePanel');
            const close = document.getElementById('presenceClose');
            if (toggle && panel) toggle.addEventListener('click', () => panel.classList.toggle('show'));
            if (close && panel) close.addEventListener('click', () => panel.classList.remove('show'));
        });
    </script>
</body>
