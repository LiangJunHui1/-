<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体重记录表 - 梁 / 滕 / 乔 / 慕</title>
    <!-- 移除外部依赖以提速：内置字体栈与自绘图表 -->
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Roboto, Arial, sans-serif;
            background: #f5f7fb;
            margin: 0; padding: 24px;
            color: #1f2330;
        }
        .container {
            max-width: 1100px; margin: 0 auto;
            background: #fff; border-radius: 16px;
            box-shadow: 0 16px 40px rgba(31,35,48,0.08);
            /* 取消 overflow 限制，确保 sticky 生效 */
            overflow: visible;
        }
        .header { padding: 28px 28px 12px; border-bottom: 1px solid #eef0f6; text-align: center; }
        .title { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
        .sub { color: #667085; font-size: 13px; }
        .motto { margin-top: 8px; display: inline-block; padding: 6px 12px; border-radius: 999px; background: #f1f5ff; color: #3730a3; font-size: 12px; box-shadow: inset 0 0 0 1px #e5e9ff; }
        .presence { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,.06), inset 0 0 0 1px #eef0f6; font-size: 12px; color: #475467; }
        .presence .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 999px; box-shadow: 0 0 0 4px rgba(34,197,94,.15); }
        .presence .names { max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .presence .nick-edit { border: 1px solid #e5e7ef; border-radius: 8px; padding: 4px 8px; font-size: 12px; width: 120px; }
        .presence .toggle { margin-left: 8px; cursor: pointer; color: #6366f1; }
        .presence-panel { position: fixed; right: 16px; top: 16px; width: 280px; max-height: 60vh; overflow: auto; background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.12); border: 1px solid #eef0f6; padding: 12px; display: none; }
        .presence-panel.show { display: block; }
        .presence-item { display:flex; align-items:center; gap:8px; padding:6px 4px; border-bottom:1px dashed #f0f2f7; }
        .presence-item:last-child { border-bottom: none; }
        .badge { background:#eef2ff; color:#3730a3; border-radius: 999px; padding:2px 6px; font-size: 11px; }

        .tabs { display: flex; gap: 8px; padding: 14px 18px 0; border-bottom: 1px solid #eef0f6; }
        .tab-btn {
            appearance: none; border: 0; background: transparent; cursor: pointer;
            padding: 10px 14px; border-radius: 10px 10px 0 0;
            color: #667085; font-weight: 600; font-size: 14px;
        }
        .tab-btn.active { background: #eef2ff; color: #3730a3; box-shadow: inset 0 -2px 0 #6366f1; transition: all .2s ease; }
        .tab-btn:not(.active):hover { transform: translateY(-1px); background: #f2f4ff; }

        .content { padding: 18px; }
        .section { display: none; }
        .section.active { display: block; }

        .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; color: #475467; font-size: 13px; }
        .toolbar .range { font-variant-numeric: tabular-nums; }
        .toolbar button {
            padding: 8px 12px; border-radius: 10px; border: 1px solid #e4e7ef; background: #fff; cursor: pointer; color: #373a47;
        }
        .toolbar button:hover { background: #f3f4f8; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead { background: #f5f7ff; position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 0 #eef0f6; }
        th, td { text-align: center; padding: 10px 8px; border-bottom: 1px solid #eef0f6; }
        tr:nth-child(even) td { background: #fafbff; }
        tbody tr { transition: background-color .15s ease; }
        tbody tr:hover { background: #f0f3ff; }
        input[type="number"] {
            width: 100px; padding: 8px 10px; border-radius: 8px;
            border: 1.5px solid #d5d9e6; outline: none; font-variant-numeric: tabular-nums;
        }
        input[type="number"]:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); transform: translateY(-1px); transition: all .15s ease; }
        input[type="number"]:out-of-range { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }

        .chart-wrap { margin-top: 16px; background: #fff; border: 1px solid #eef0f6; border-radius: 12px; padding: 12px; overflow: hidden; }
        .chart-wrap.sticky { position: sticky; top: 0; z-index: 20; border-radius: 0 0 12px 12px; box-shadow: 0 6px 18px rgba(31,35,48,0.08); border-top: none; }
        .chart-wrap.sticky::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 10px; background: linear-gradient(#ffffff, rgba(255,255,255,0)); pointer-events: none; }
        .chart-title { font-size: 13px; color: #475467; margin: 0 0 8px; }
        .muted { color: #98a2b3; font-size: 12px; }

        .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #1f2330; color: #fff; padding: 10px 14px; border-radius: 10px; opacity: 0; pointer-events: none; transition: all .25s ease; box-shadow: 0 8px 24px rgba(0,0,0,.2); font-size: 13px; }
        .toast.show { opacity: 0.96; transform: translateX(-50%) translateY(0); }

        @media (max-width: 640px) {
            .toolbar { flex-direction: column; align-items: flex-start; gap: 6px; }
            input[type="number"] { width: 90px; }
        }
    </style>
    <script>
        // 日期范围：从 2025-11-03 起两个月
        const START_DATE = new Date('2025-11-03');
        const END_DATE = (() => { const d = new Date(START_DATE); d.setMonth(d.getMonth() + 2); d.setDate(d.getDate() - 1); return d; })();
        const PEOPLE = [
            { key: 'liang', label: '梁君辉', color: '#6366f1' },
            { key: 'teng',  label: '滕浠顺', color: '#22c55e' },
            { key: 'qiao',  label: '李乔', color: '#ef4444' },
            { key: 'mu',    label: '慕忠伟', color: '#f59e0b' },
        ];

        const weekdays = ['日','一','二','三','四','五','六'];

        function fmtDate(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth()+1).padStart(2,'0');
            const da = String(d.getDate()).padStart(2,'0');
            return `${y}-${m}-${da}`;
        }

        function dateRange(start, end) {
            const list = []; const cur = new Date(start);
            while (cur <= end) { list.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
            return list;
        }

        function storageKey(personKey) { return `weightRecords_${personKey}_${fmtDate(START_DATE)}_${fmtDate(END_DATE)}`; }

        function loadData(personKey) {
            try { return JSON.parse(localStorage.getItem(storageKey(personKey)) || '{}'); } catch { return {}; }
        }

        function saveData(personKey, data) {
            localStorage.setItem(storageKey(personKey), JSON.stringify(data));
        }

        function buildTable(person) {
            const dates = dateRange(START_DATE, END_DATE);
            const data = loadData(person.key);
            const tbody = document.createElement('tbody');

            dates.forEach(d => {
                const dateStr = fmtDate(d);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${dateStr}</td>
                    <td>${weekdays[d.getDay()]}</td>
                    <td>
                        <input type="number" step="0.1" min="60" max="100"
                               data-person="${person.key}" data-date="${dateStr}" value="${data[dateStr] ?? ''}" />
                    </td>
                `;
                tbody.appendChild(tr);
            });
            return tbody;
        }

        function buildSection(person) {
            const section = document.createElement('div');
            section.className = 'section';

            const toolbar = document.createElement('div');
            toolbar.className = 'toolbar';
            toolbar.innerHTML = `
                <div class="range">日期范围：${fmtDate(START_DATE)} 至 ${fmtDate(END_DATE)}（共 ${dateRange(START_DATE, END_DATE).length} 天）</div>
                <span class="muted">单位：kg（小数一位），有效范围：60–100</span>
                <span style="flex:1"></span>
                <button type="button" data-action="clear" data-person="${person.key}">清空本页记录</button>
                <button type="button" data-action="export" data-person="${person.key}">导出CSV</button>
                
            `;

            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>星期</th>
                        <th>${person.label}（kg）</th>
                    </tr>
                </thead>
            `;
            table.appendChild(buildTable(person));

            const chartWrap = document.createElement('div');
            chartWrap.className = 'chart-wrap sticky';
            chartWrap.innerHTML = `
                <div class="chart-title">${person.label} 的体重趋势</div>
                <canvas id="chart_${person.key}" height="180"></canvas>
                <div class="muted">提示：留空表示未记录，曲线会自动跳过。</div>
            `;

            section.appendChild(toolbar);
            section.appendChild(chartWrap);
            section.appendChild(table);
            return section;
        }

        function gatherSeries(personKey) {
            const inputs = Array.from(document.querySelectorAll(`input[data-person="${personKey}"]`));
            inputs.sort((a,b) => a.dataset.date.localeCompare(b.dataset.date));
            const labels = inputs.map(i => i.dataset.date);
            const values = inputs.map(i => i.value === '' ? null : Number(i.value));
            return { labels, values };
        }

        // 构建汇总对比section
        function buildComparisonSection() {
            const section = document.createElement('div');
            section.className = 'section';
            section.id = 'section_comparison';

            const toolbar = document.createElement('div');
            toolbar.className = 'toolbar';
            toolbar.innerHTML = `
                <div class="range">日期范围：${fmtDate(START_DATE)} 至 ${fmtDate(END_DATE)}（共 ${dateRange(START_DATE, END_DATE).length} 天）</div>
                <span class="muted">四个人的体重对比折线图</span>
                <span style="flex:1"></span>
            `;

            const chartWrap = document.createElement('div');
            chartWrap.className = 'chart-wrap sticky';
            chartWrap.style.marginBottom = '20px';
            chartWrap.innerHTML = `
                <div class="chart-title">四人体重对比趋势</div>
                <canvas id="chart_comparison" height="300"></canvas>
                <div class="muted" style="margin-top: 12px;">提示：留空表示未记录，曲线会自动跳过。</div>
                <div style="display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap;">
                    ${PEOPLE.map(p => `<div style="display: flex; align-items: center; gap: 6px;">
                        <span style="display: inline-block; width: 12px; height: 3px; background: ${p.color}; border-radius: 2px;"></span>
                        <span style="font-size: 12px; color: #475467;">${p.label}</span>
                    </div>`).join('')}
                </div>
            `;

            section.appendChild(toolbar);
            section.appendChild(chartWrap);
            return section;
        }

        // 轻量原生 Canvas 折线图
        const charts = {};
        function renderChart(person, animate = false) {
            const canvas = document.getElementById(`chart_${person.key}`);
            if (!canvas) return;
            const DPR = Math.min(window.devicePixelRatio || 1, 2);
            const parentWidth = canvas.parentElement.clientWidth - 24;
            const displayW = Math.max(480, parentWidth);
            const displayH = 180;
            canvas.style.width = displayW + 'px';
            canvas.style.height = displayH + 'px';
            canvas.width = Math.floor(displayW * DPR);
            canvas.height = Math.floor(displayH * DPR);
            const ctx = canvas.getContext('2d');
            ctx.scale(DPR, DPR);

            const { labels, values } = gatherSeries(person.key);
            const padding = { left: 40, right: 10, top: 10, bottom: 26 };
            const W = displayW - padding.left - padding.right;
            const H = displayH - padding.top - padding.bottom;

            // 过滤非空取 min/max
            const nums = values.filter(v => v != null);
            let minY = Math.min(...nums);
            let maxY = Math.max(...nums);
            if (!isFinite(minY) || !isFinite(maxY)) { minY = 40; maxY = 100; }
            if (minY === maxY) { minY -= 1; maxY += 1; }
            const margin = (maxY - minY) * 0.08;
            minY -= margin; maxY += margin;

            // 横坐标位置仅由日期数量决定，与是否有数据无关，避免清空后全部重叠在一起
            function xAt(i) { return padding.left + i * (W / ((labels.length - 1) || 1)); }
            function yAt(v) { return padding.top + (H - (v - minY) / (maxY - minY) * H); }

            // 背景
            ctx.clearRect(0, 0, displayW, displayH);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, displayW, displayH);

            // 网格与坐标（Y 轴）
            ctx.strokeStyle = '#eef0f6';
            ctx.lineWidth = 1;
            const gridLines = 4;
            for (let i = 0; i <= gridLines; i++) {
                const y = padding.top + (H / gridLines) * i;
                ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(displayW - padding.right, y); ctx.stroke();
                const val = (maxY - (maxY - minY) * (i / gridLines)).toFixed(0);
                ctx.fillStyle = '#98a2b3'; ctx.font = '12px system-ui';
                ctx.fillText(val, 6, y + 4);
            }

            // X 轴：从 11-03 开始每 7 天一个刻度与标签
            const step = 7;
            const axisY = displayH - padding.bottom + 6;
            ctx.fillStyle = '#98a2b3'; ctx.font = '12px system-ui';
            ctx.strokeStyle = '#e5e7ef';
            for (let i = 0; i < labels.length; i += step) {
                const x = xAt(i);
                // 刻度
                ctx.beginPath(); ctx.moveTo(x, displayH - padding.bottom); ctx.lineTo(x, displayH - padding.bottom + 4); ctx.stroke();
                // 标签（MM-DD）
                const label = labels[i].slice(5); // 11-03
                const textW = ctx.measureText(label).width;
                ctx.fillText(label, x - textW/2, axisY + 12);
            }

            // 折线（无动画稳定绘制，自动跳过空值段）
            ctx.lineWidth = 2;
            ctx.strokeStyle = person.color;
            ctx.fillStyle = person.color + '22';

            let prevValid = null;
            ctx.beginPath();
            labels.forEach((d, i) => {
                const v = values[i];
                if (v == null) { prevValid = null; return; }
                const x = xAt(i); const y = yAt(v);
                if (prevValid == null) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                prevValid = [x, y];
            });
            ctx.stroke();

            // 悬浮高亮（仅绘制圆点，不重启动画）
            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const relX = (e.clientX - rect.left) * (displayW / rect.width);
                const idxFloat = (relX - padding.left) / (W / (labels.length - 1 || 1));
                const idx = Math.max(0, Math.min(labels.length - 1, Math.round(idxFloat)));
                const v = values[idx];
                // 先重绘基础曲线
                renderChart(person, false);
                if (v == null) return;
                const cx = xAt(idx); const cy = yAt(v);
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = person.color;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            };
            canvas.onmouseleave = () => renderChart(person, false);
        }

        // 渲染多人对比图表
        function renderComparisonChart(animate = false) {
            const canvas = document.getElementById('chart_comparison');
            if (!canvas) return;
            const DPR = Math.min(window.devicePixelRatio || 1, 2);
            const parentWidth = canvas.parentElement.clientWidth - 24;
            const displayW = Math.max(480, parentWidth);
            const displayH = 300;
            canvas.style.width = displayW + 'px';
            canvas.style.height = displayH + 'px';
            canvas.width = Math.floor(displayW * DPR);
            canvas.height = Math.floor(displayH * DPR);
            const ctx = canvas.getContext('2d');
            ctx.scale(DPR, DPR);

            // 获取所有日期（使用第一个人的日期作为基准）
            const dates = dateRange(START_DATE, END_DATE);
            const labels = dates.map(d => fmtDate(d));

            // 收集所有人的数据
            const allSeries = PEOPLE.map(person => {
                const data = loadData(person.key);
                const values = labels.map(date => {
                    const val = data[date];
                    return val === '' || val === undefined ? null : Number(val);
                });
                return { person, values };
            });

            const padding = { left: 50, right: 10, top: 20, bottom: 35 };
            const W = displayW - padding.left - padding.right;
            const H = displayH - padding.top - padding.bottom;

            // 计算所有数据的最小值和最大值
            const allValues = allSeries.flatMap(s => s.values.filter(v => v != null));
            let minY = Math.min(...allValues);
            let maxY = Math.max(...allValues);
            if (!isFinite(minY) || !isFinite(maxY)) { minY = 40; maxY = 100; }
            if (minY === maxY) { minY -= 1; maxY += 1; }
            const margin = (maxY - minY) * 0.1;
            minY -= margin; maxY += margin;

            function xAt(i) { return padding.left + i * (W / ((labels.length - 1) || 1)); }
            function yAt(v) { return padding.top + (H - (v - minY) / (maxY - minY) * H); }

            // 背景
            ctx.clearRect(0, 0, displayW, displayH);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, displayW, displayH);

            // 网格与坐标（Y 轴）
            ctx.strokeStyle = '#eef0f6';
            ctx.lineWidth = 1;
            const gridLines = 5;
            for (let i = 0; i <= gridLines; i++) {
                const y = padding.top + (H / gridLines) * i;
                ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(displayW - padding.right, y); ctx.stroke();
                const val = (maxY - (maxY - minY) * (i / gridLines)).toFixed(0);
                ctx.fillStyle = '#98a2b3'; ctx.font = '12px system-ui';
                ctx.fillText(val, 8, y + 4);
            }

            // X 轴：每 7 天一个刻度
            const step = 7;
            const axisY = displayH - padding.bottom + 6;
            ctx.fillStyle = '#98a2b3'; ctx.font = '12px system-ui';
            ctx.strokeStyle = '#e5e7ef';
            for (let i = 0; i < labels.length; i += step) {
                const x = xAt(i);
                ctx.beginPath(); ctx.moveTo(x, displayH - padding.bottom); ctx.lineTo(x, displayH - padding.bottom + 4); ctx.stroke();
                const label = labels[i].slice(5);
                const textW = ctx.measureText(label).width;
                ctx.fillText(label, x - textW/2, axisY + 12);
            }

            // 绘制每个人的折线
            allSeries.forEach(({ person, values }) => {
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = person.color;
                ctx.fillStyle = person.color + '22';

                let prevValid = null;
                ctx.beginPath();
                labels.forEach((d, i) => {
                    const v = values[i];
                    if (v == null) { prevValid = null; return; }
                    const x = xAt(i); const y = yAt(v);
                    if (prevValid == null) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    prevValid = [x, y];
                });
                ctx.stroke();
            });

            // 鼠标悬浮显示所有数据点
            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const relX = (e.clientX - rect.left) * (displayW / rect.width);
                const idxFloat = (relX - padding.left) / (W / (labels.length - 1 || 1));
                const idx = Math.max(0, Math.min(labels.length - 1, Math.round(idxFloat)));
                
                // 重绘基础图表
                renderComparisonChart(false);
                
                // 绘制所有人在该日期的数据点
                allSeries.forEach(({ person, values }) => {
                    const v = values[idx];
                    if (v == null) return;
                    const cx = xAt(idx); const cy = yAt(v);
                    ctx.fillStyle = '#fff';
                    ctx.strokeStyle = person.color;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                });
            };
            canvas.onmouseleave = () => renderComparisonChart(false);
        }

        // 更新图表辅助函数：如果当前在对比页面，也更新对比图表
        function updateCharts(person) {
            renderChart(person, false);
            // 如果当前显示的是对比页面，也更新对比图表
            const activeSection = document.querySelector('.section.active');
            if (activeSection && activeSection.id === 'section_comparison') {
                renderComparisonChart(false);
            }
        }

        // 简易防抖
        function debounce(fn, wait){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); }; }

        // 清空保护：在短时间内忽略来自云端的旧数据回流
        window._clearingMap = window._clearingMap || {};
        function markClearing(personKey) {
            window._clearingMap[personKey] = Date.now();
            setTimeout(() => {
                const ts = window._clearingMap[personKey];
                if (ts && Date.now() - ts > 7000) delete window._clearingMap[personKey];
            }, 8000);
        }
        function isClearing(personKey) {
            const ts = window._clearingMap && window._clearingMap[personKey];
            return !!ts && (Date.now() - ts < 7000);
        }

        // 单日删除抖动保护：本机刚删除的日期，短时间内忽略远端回写
        window._suppressMap = window._suppressMap || {};
        function keyOf(personKey, date){ return `${personKey}__${date}`; }
        function markSuppress(personKey, date) {
            window._suppressMap[keyOf(personKey,date)] = Date.now();
            setTimeout(() => {
                const k = keyOf(personKey,date);
                const ts = window._suppressMap[k];
                if (ts && Date.now() - ts > 5000) delete window._suppressMap[k];
            }, 6000);
        }
        function isSuppressed(personKey, date) {
            const ts = window._suppressMap[keyOf(personKey,date)];
            return !!ts && (Date.now() - ts < 5000);
        }

        function attachEvents() {
            const onInput = debounce((target) => {
                const personKey = target.dataset.person;
                const date = target.dataset.date;
                const raw = String(target.value || '').trim();
                const num = parseFloat(raw);
                const isEmpty = raw === '';
                const isNumber = !Number.isNaN(num);
                const inRange = isNumber && num >= 60 && num <= 100;
                
                // 本地数据始终先更新，确保输入不会被回写覆盖
                const localData = loadData(personKey);
                if (isEmpty) {
                    delete localData[date];
                    // 标记单日删除抖动保护
                    markSuppress(personKey, date);
                } else {
                    localData[date] = raw; // 暂存原始值（可能暂时越界）
                }
                saveData(personKey, localData);
                
                // 保存到云端（带数据合并，避免覆盖其他设备的数据）
                // 仅在为空或数值合法范围内时才同步到云端；输入过程中的越界值不触发云端写入
                if (isEmpty && window.db) {
                    // 单日删除：使用字段级删除，避免并发回流导致还原
                    (async () => {
                        try {
                            await deleteDateCloud(personKey, date);
                            console.log('✅ 单日删除已同步到云端', personKey, date);
                            const person = PEOPLE.find(p => p.key === personKey);
                            if (person) updateCharts(person);
                        } catch (eDel) {
                            console.error('❌ 单日删除云端同步失败', eDel);
                            toast('云端删除失败，仅本地已删除');
                        }
                    })();
                } else if ((isEmpty || inRange) && window.cloudStorage && window.cloudStorage.save) {
                    (async () => {
                        try {
                            let mergedData = localData;
                            if (!isClearing(personKey)) {
                                // 先从云端加载最新数据（设置超时，避免长时间等待）
                                let remoteData = null;
                                try {
                                    const loadPromise = window.cloudStorage.load(personKey);
                                    const timeoutPromise = new Promise((_, reject) => 
                                        setTimeout(() => reject(new Error('加载超时')), 3000)
                                    );
                                    remoteData = await Promise.race([loadPromise, timeoutPromise]);
                                    console.log('📥 保存前加载云端数据:', remoteData);
                                } catch(loadError) {
                                    console.warn('⚠️ 加载云端数据失败，使用本地数据保存:', loadError.message);
                                }
                                // 合并本地更改和云端数据（如果有的话）
                                mergedData = remoteData ? { ...(remoteData || {}), ...localData } : localData;
                                // 若本次是删除该日期，明确从合并结果中删除该键，避免远端旧值回流
                                if (isEmpty && mergedData.hasOwnProperty(date)) {
                                    delete mergedData[date];
                                }
                            } else {
                                console.log('🛡️ 清空保护中：跳过远端合并，仅保存本地数据');
                            }
                            console.log('🔀 合并后的数据:', mergedData);
                            console.log('💾 准备保存到云端:', { personKey, dataSize: Object.keys(mergedData).length });
                            
                            // 保存合并后的数据
                            await window.cloudStorage.save(personKey, mergedData);
                            console.log('✅ 体重数据已同步到 CloudBase', personKey);
                            
                            // 更新本地数据为合并后的数据
                            saveData(personKey, mergedData);
                            
                            // 更新界面（以防有来自其他设备的数据）
                            const inputs = document.querySelectorAll(`input[data-person="${personKey}"]`);
                            inputs.forEach(input => {
                                const value = mergedData[input.dataset.date] ?? '';
                                if (input.value !== String(value)) {
                                    console.log(`🔄 更新界面: ${input.dataset.date} = ${value}`);
                                    input.value = value;
                                }
                            });
                            
                            const person = PEOPLE.find(p => p.key === personKey);
                            if (person) updateCharts(person);
                        } catch(e) {
                            console.error('❌ 体重数据同步失败', personKey, e);
                            console.error('错误详情:', e.stack || e);
                            // 即使云端同步失败，也要更新本地图表
                            const person = PEOPLE.find(p => p.key === personKey);
                            if (person) updateCharts(person);
                            // 只显示警告，不阻止用户操作
                            toast('云端同步失败，数据已保存到本地');
                        }
                    })();
                } else {
                    // 如果没有云端存储，只更新本地图表
                    const person = PEOPLE.find(p => p.key === personKey);
                    if (person) updateCharts(person);
                }
                // 仅在合法保存到云端或清空时提示已保存；越界输入过程不提示
                if (isEmpty || inRange) toast('已保存');
            }, 120);

            document.addEventListener('input', (e) => {
                if (e.target.matches('input[type="number"][data-person]')) {
                    onInput(e.target);
                }
            });

            // 失焦时若越界则自动夹紧到 [60,100]
            document.addEventListener('blur', (e) => {
                if (e.target && e.target.matches('input[type="number"][data-person]')) {
                    const target = e.target;
                    if (target.value === '') return;
                    let v = parseFloat(target.value);
                    if (Number.isNaN(v)) return;
                    if (v < 60) v = 60; if (v > 100) v = 100;
                    if (String(v) !== target.value) {
                        target.value = v.toFixed(1);
                        // 触发保存
                        const evt = new Event('input', { bubbles: true });
                        target.dispatchEvent(evt);
                    }
                }
            }, true);

            document.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const action = btn.dataset.action;
                const personKey = btn.dataset.person;
                if (action === 'clear') {
                    if (confirm('确定清空该页的所有记录吗？此操作不可撤销。')) {
                        (async () => {
                            // 标记清空保护，防止旧数据在短时间内回流
                            markClearing(personKey);
                            // 先清空本地与界面
                            saveData(personKey, {});
                            document.querySelectorAll(`input[data-person="${personKey}"]`).forEach(i => i.value = '');
                            const person = PEOPLE.find(p => p.key === personKey);
                            if (person) updateCharts(person);

                            // 云端直接删除文档，避免历史字段残留
                            try {
                                if (window.db) {
                                    try {
                                        await window.ready;
                                    } catch (_) {}
                                    const id = docId(personKey);
                                    await window.db.collection('WeightRecord').doc(id).remove();
                                    console.log('✅ 已删除云端文档以完成清空', personKey, id);
                                } else if (window.cloudStorage && window.cloudStorage.save) {
                                    // 兜底：无 db 引用时，使用 set({})
                                    await window.cloudStorage.save(personKey, {});
                                    console.log('✅ 使用 set({}) 作为清空兜底', personKey);
                                }

                                // 再次校验云端状态
                                if (window.cloudStorage && window.cloudStorage.load) {
                                    const verify = await window.cloudStorage.load(personKey);
                                    if (verify && Object.keys(verify).length > 0) {
                                        console.warn('⚠️ 云端验证仍存在数据，尝试覆盖为空');
                                        if (window.db) {
                                            const id = docId(personKey);
                                            await window.db.collection('WeightRecord').doc(id).set({ personKey, records: {}, updatedAtMs: Date.now() });
                                        } else {
                                            await window.cloudStorage.save(personKey, {});
                                        }
                                    }
                                }
                                toast('已清空该页记录');
                            } catch(e2) {
                                console.error('❌ 云端清空失败', personKey, e2);
                                toast('云端清空失败，仅本地已清空');
                            }
                        })();
                    }
                }
                if (action === 'export') {
                    exportCSV(personKey);
                    toast('已导出 CSV');
                }
                
            });
        }

        

        function exportCSV(personKey) {
            const { labels, values } = gatherSeries(personKey);
            const rows = [['日期','体重(kg)']].concat(labels.map((d,i) => [d, values[i] ?? '']));
            const csv = rows.map(r => r.join(',')).join('\n');
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${personKey}_${fmtDate(START_DATE)}_${fmtDate(END_DATE)}.csv`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function scrollToTodayIfVisible(sectionEl) {
            const today = new Date();
            const todayStr = fmtDate(today);
            const row = sectionEl.querySelector(`input[data-date="${todayStr}"]`);
            if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function toast(msg) {
            let el = document.querySelector('.toast');
            if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
            el.textContent = msg; el.classList.add('show');
            clearTimeout(toast._t); toast._t = setTimeout(()=> el.classList.remove('show'), 900);
        }

        function init() {
            // 构建 Tabs
            const tabs = document.getElementById('tabs');
            const views = document.getElementById('views');
            
            // 添加个人记录tab
            PEOPLE.forEach((p, idx) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (idx===0 ? ' active' : '');
                btn.textContent = p.label;
                btn.dataset.target = p.key;
                tabs.appendChild(btn);

                const sec = buildSection(p);
                sec.id = `section_${p.key}`;
                if (idx===0) sec.classList.add('active');
                views.appendChild(sec);
            });

            // 添加汇总对比tab
            const comparisonBtn = document.createElement('button');
            comparisonBtn.className = 'tab-btn';
            comparisonBtn.textContent = '对比';
            comparisonBtn.dataset.target = 'comparison';
            tabs.appendChild(comparisonBtn);

            const comparisonSec = buildComparisonSection();
            views.appendChild(comparisonSec);

            tabs.addEventListener('click', (e) => {
                const btn = e.target.closest('.tab-btn');
                if (!btn) return;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const key = btn.dataset.target;
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById(`section_${key}`).classList.add('active');
                
                if (key === 'comparison') {
                    // 汇总对比页面
                    renderComparisonChart(false);
                } else {
                    // 个人记录页面
                    const person = PEOPLE.find(p => p.key === key);
                    if (person) {
                        renderChart(person, false);
                        scrollToTodayIfVisible(document.getElementById(`section_${key}`));
                    }
                }
                
                // 更新在线状态当前Tab（TCB）
                try { if (window.updatePresenceTab) window.updatePresenceTab(key); } catch(e) {}
            });

            attachEvents();

            // 初次渲染所有图表
            PEOPLE.forEach(p => renderChart(p, false));
            // 定位到今天（若在范围内）
            scrollToTodayIfVisible(document.querySelector('.section.active'));

            // 窗口尺寸变化时，重绘当前可见图表
            window.addEventListener('resize', debounce(() => {
                const activeBtn = document.querySelector('.tab-btn.active');
                const key = activeBtn ? activeBtn.dataset.target : PEOPLE[0].key;
                if (key === 'comparison') {
                    renderComparisonChart(false);
                } else {
                    const person = PEOPLE.find(p => p.key === key);
                    if (person) renderChart(person, false);
                }
            }, 120));

            // 云端订阅（CloudBase）与首次拉取
            const initCloudSync = async () => {
                // 等待 window.cloudStorage 可用
                let retries = 0;
                while (!window.cloudStorage && retries < 50) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    retries++;
                }
                
                if (!window.cloudStorage) {
                    console.error('❌ window.cloudStorage 不可用，无法同步数据');
                    return;
                }
                
                // 等待 CloudBase 初始化完成
                try {
                    console.log('⏳ 等待 CloudBase 初始化...');
                    await window.cloudStorage.ready;
                    console.log('✅ CloudBase 初始化完成，开始加载数据');
                } catch(e) {
                    console.error('❌ CloudBase 初始化失败:', e);
                    return;
                }
                
                console.log('🚀 开始从 CloudBase 加载数据...');
                
                // 首次拉取合并（使用 for...of 确保顺序执行）
                for (const p of PEOPLE) {
                    try {
                        console.log(`📥 加载 ${p.label} 的数据...`);
                        const remote = await window.cloudStorage.load(p.key);
                        console.log(`📥 ${p.label} 的云端数据:`, remote);
                        
                        if (remote && typeof remote === 'object' && Object.keys(remote).length > 0) {
                            console.log(`✅ 找到 ${p.label} 的云端数据，共 ${Object.keys(remote).length} 条记录`);
                            saveData(p.key, remote);
                            
                            // 更新界面
                            const inputs = document.querySelectorAll(`input[data-person="${p.key}"]`);
                            inputs.forEach(input => { 
                                const value = remote[input.dataset.date] ?? '';
                                input.value = value;
                            });
                            
                            updateCharts(p);
                            console.log(`✅ ${p.label} 的数据已加载到界面`);
                        } else {
                            console.log(`⚠️ ${p.label} 没有云端数据，清除本地缓存`);
                            // 云端数据为空，清除本地存储
                            saveData(p.key, {});
                            
                            // 清空界面显示
                            const inputs = document.querySelectorAll(`input[data-person="${p.key}"]`);
                            inputs.forEach(input => { 
                                input.value = '';
                            });
                            
                            updateCharts(p);
                            console.log(`✅ ${p.label} 的本地缓存已清除`);
                        }
                    } catch(e) {
                        console.error(`❌ 加载 ${p.label} 的数据失败:`, e);
                    }
                }
                
                console.log('✅ 所有数据加载完成');
                
                // 订阅实时更新
                PEOPLE.forEach(p => {
                    window.cloudStorage.subscribe(p.key, (remote) => {
                        console.log(`📢 收到 ${p.label} 的实时更新:`, remote);
                        // 清空保护：若刚清空且远端仍返回旧数据，忽略本次
                        if (isClearing(p.key) && remote && Object.keys(remote||{}).length > 0) {
                            console.warn(`🛡️ 清空保护：忽略 ${p.label} 的旧数据回流`);
                            return;
                        }
                        // 合并远端数据到本地与界面
                        saveData(p.key, remote || {});
                        const inputs = document.querySelectorAll(`input[data-person="${p.key}"]`);
                        inputs.forEach(input => {
                            const d = input.dataset.date;
                            // 若该日处于删除抖动保护，忽略远端值回写
                            if (isSuppressed(p.key, d)) return;
                            const v = (remote || {})[d] ?? '';
                            if (input.value !== String(v)) input.value = v;
                        });
                        updateCharts(p);
                    });
                });
                
                // 轮询兜底：即使 watch 不通也能看到他人数据
                setInterval(async () => {
                    try {
                        for (const p of PEOPLE) {
                            const remote = await window.cloudStorage.load(p.key);
                            const cached = loadData(p.key) || {};
                            const changed = JSON.stringify(remote||{}) !== JSON.stringify(cached||{});
                            if (changed) {
                                console.log(`🔄 轮询发现 ${p.label} 的数据有变化`);
                                saveData(p.key, remote || {});
                                const inputs = document.querySelectorAll(`input[data-person="${p.key}"]`);
                                inputs.forEach(input => {
                                    const d = input.dataset.date;
                                    if (isSuppressed(p.key, d)) return;
                                    input.value = (remote||{})[d] ?? '';
                                });
                                updateCharts(p);
                            }
                        }
                    } catch(e) {
                        console.warn('⚠️ 轮询失败:', e);
                    }
                }, 15000);
            };
            
            // 启动云端同步
            initCloudSync().catch((e) => {
                console.error('❌ 云端同步初始化失败:', e);
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</head>
