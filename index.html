    <!-- 腾讯云 CloudBase 实时数据库（国内可用） -->
    <script>
        // 全局变量（供诊断函数使用）
        window.TCB_ENV_ID = 'cloud1-3g1ct7bc04d6c606';
        window.TCB_REGION = 'ap-shanghai';
        window.loginStatus = 'pending';
        window.lastError = null;
        window.app = null;
        window.auth = null;
        window.db = null;
        window.ready = null;

        // 使用 CloudBase Web 端官方 CDN（2.22.1 版本）
        const SDK_VERSION = '2.22.1';
        const SDK_URL = `https://static.cloudbase.net/cloudbase-js-sdk/${SDK_VERSION}/cloudbase.full.js`;

        function loadSDK() {
            if (typeof cloudbase !== 'undefined') {
                initCloudBase();
                return;
            }

            console.log(`📦 加载 CloudBase SDK: ${SDK_URL}`);
            const script = document.createElement('script');
            script.src = SDK_URL;
            script.onload = () => {
                console.log('✅ SDK 加载成功');
                initCloudBase();
            };
            script.onerror = () => {
                console.error('❌ SDK 加载失败，请检查网络连接');
                window.loginStatus = 'failed';
                window.lastError = 'SDK 加载失败：无法访问 CloudBase CDN';
                if (typeof toast === 'function') {
                    toast('CloudBase SDK 加载失败，请检查网络或刷新页面');
                }
            };
            document.head.appendChild(script);
        }

        // CloudBase 初始化（使用官方 cloudbase 对象）
        function initCloudBase() {
            if (typeof cloudbase === 'undefined') {
                console.error('❌ CloudBase SDK 未定义');
                window.loginStatus = 'failed';
                window.lastError = 'SDK 未定义';
                return;
            }
            
            try {
                console.log('🚀 初始化 CloudBase...', window.TCB_ENV_ID);
                window.app = cloudbase.init({ env: window.TCB_ENV_ID });
                window.auth = window.app.auth({ persistence: 'local' });
                window.db = window.app.database();
                console.log('✅ CloudBase 初始化完成，db 已设置');

                // 匿名登录（带诊断）
                window.ready = (async () => {
                    try {
                        // 调试：查看 auth 对象可用方法
                        console.log('🔍 Auth 对象方法:', Object.keys(window.auth).filter(k => typeof window.auth[k] === 'function'));
                        
                        // CloudBase SDK 2.x 匿名登录方式
                        let loginState;
                        if (typeof window.auth.signInAnonymously === 'function') {
                            // 方法 1: signInAnonymously() (SDK 2.x)
                            console.log('📝 使用方法: signInAnonymously()');
                            loginState = await window.auth.signInAnonymously();
                        } else if (typeof window.auth.signInAnonymous === 'function') {
                            // 方法 2: signInAnonymous() (备用)
                            console.log('📝 使用方法: signInAnonymous()');
                            loginState = await window.auth.signInAnonymous();
                        } else if (window.auth.anonymousAuthProvider && typeof window.auth.anonymousAuthProvider === 'function') {
                            // 方法 3: anonymousAuthProvider().signIn() (SDK 1.x)
                            console.log('📝 使用方法: anonymousAuthProvider().signIn()');
                            loginState = await window.auth.anonymousAuthProvider().signIn();
                        } else {
                            // 列出所有方法供调试
                            const methods = Object.keys(window.auth).filter(k => typeof window.auth[k] === 'function');
                            console.error('❌ 可用的 auth 方法:', methods);
                            throw new Error('匿名登录方法不可用，可用的方法: ' + methods.join(', '));
                        }
                        window.loginStatus = 'success';
                        console.log('✅ CloudBase 登录成功', loginState || window.auth.currentUser);
                        return true;
                    } catch(e) {
                        window.loginStatus = 'failed';
                        window.lastError = e.message || String(e);
                        console.error('❌ CloudBase 登录失败', e);
                        
                        // 尝试解析错误消息（可能是 JSON 字符串）
                        let errorMsg = e.message || String(e);
                        let errorCode = '';
                        try {
                            const errorObj = JSON.parse(errorMsg);
                            errorMsg = errorObj.msg || errorMsg;
                            errorCode = errorObj.code || '';
                        } catch(parseErr) {
                            // 如果不是 JSON，直接使用原消息
                        }
                        
                        // 检查是否是匿名登录未启用错误
                        const isAnonymousDisabled = errorCode === 'ACCESS_TOKEN_DISABLED' || 
                                                     errorMsg.includes('ACCESS_TOKEN_DISABLED') ||
                                                     errorMsg.includes('开启匿名登录');
                        
                        // 检查是否是 CORS 错误
                        const isCorsError = errorMsg.includes('CORS') || 
                                           errorMsg.includes('network request error') ||
                                           errorMsg.includes('Access-Control-Allow-Origin');
                        
                        if (isAnonymousDisabled) {
                            console.error(`⚠️ 匿名登录未启用：需要在 CloudBase 控制台开启匿名登录`);
                            console.error(`📝 配置步骤：`);
                            console.error(`   1. 登录 https://tcb.cloud.tencent.com/dev`);
                            console.error(`   2. 选择环境：${window.TCB_ENV_ID}`);
                            console.error(`   3. 进入「身份认证」→「登录方式」`);
                            console.error(`   4. 开启「匿名登录」`);
                            console.error(`   5. 确保已保存配置`);
                            
                            if (typeof toast === 'function') {
                                toast('需要在 CloudBase 控制台开启匿名登录', 10000);
                            }
                        } else if (isCorsError) {
                            const currentDomain = window.location.hostname;
                            console.error(`⚠️ CORS 跨域错误：需要在 CloudBase 控制台配置安全域名`);
                            console.error(`📍 当前域名：${currentDomain}`);
                            console.error(`📝 配置步骤：`);
                            console.error(`   1. 登录 https://console.cloud.tencent.com/tcb`);
                            console.error(`   2. 选择环境：${window.TCB_ENV_ID}`);
                            console.error(`   3. 进入「安全配置」→「安全域名」`);
                            console.error(`   4. 添加域名：${currentDomain}`);
                            
                            if (typeof toast === 'function') {
                                toast(`需要在 CloudBase 控制台配置安全域名：${currentDomain}`, 8000);
                            }
                        } else {
                            if (typeof toast === 'function') {
                                toast('CloudBase 连接失败：' + errorMsg);
                            }
                        }
                        return false;
                    }
                })();
            } catch(e) {
                window.loginStatus = 'failed';
                window.lastError = e.message || String(e);
                console.error('❌ CloudBase 初始化失败', e);
            }
        }

        // 开始加载 SDK
        if (typeof cloudbase !== 'undefined') {
            console.log('📦 SDK 已存在，直接初始化');
            initCloudBase();
        } else {
            console.log('⏳ 开始加载 SDK...');
            loadSDK();
        }

        function docId(personKey) {
            const s = window.START_DATE || new Date('2025-11-03');
            const e = window.END_DATE   || new Date('2026-01-02');
            const pad = n => String(n).padStart(2,'0');
            const f = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
            return `${personKey}_${f(s)}_${f(e)}`;
        }

        async function loadCloud(personKey) {
            try {
                if (!window.db) {
                    console.warn('⏳ 等待 CloudBase 初始化...');
                    let retries = 0;
                    while (!window.db && retries < 20) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        retries++;
                    }
                    if (!window.db) {
                        console.error('❌ CloudBase 未初始化');
                        return {};
                    }
                }
                await window.ready;
                const id = docId(personKey);
                console.log('📥 准备加载数据从 CloudBase 文档数据库:', {
                    collection: 'WeightRecord',
                    docId: id
                });
                const res = await window.db.collection('WeightRecord').doc(id).get();
                console.log('📥 查询结果:', res);
                const row = (res && res.data && res.data[0]) || null;
                if (row) {
                    console.log('✅ 加载成功，找到数据:', row);
                    return row.records || {};
                } else {
                    console.log('⚠️ 未找到数据，集合可能为空或文档不存在');
                    console.log('💡 提示：首次保存时 CloudBase 会自动创建集合「WeightRecord」');
                    return {};
                }
            } catch(e) {
                console.error('❌ 加载失败', personKey, e);
                return {};
            }
        }

        // 删除云端某一天的字段（使用 V2 指令删除 records.DATE 键）
        async function deleteDateCloud(personKey, dateStr) {
            try {
                if (!window.db) throw new Error('DB 未初始化');
                await window.ready;
                const id = docId(personKey);
                const _ = window.db.command;
                // 优先使用字段级删除，避免并发回流
                const fieldPath = `records.${dateStr}`;
                console.log('🗑️ 删除云端单日字段:', { id, fieldPath });
                const res = await window.db.collection('WeightRecord')
                    .doc(id)
                    .update({ [fieldPath]: _.remove(), updatedAtMs: Date.now() });
                console.log('🗑️ 字段删除结果:', res);
                return true;
            } catch (e) {
                console.warn('⚠️ 字段级删除失败，退回整对象覆盖方案:', e.message || e);
                // 退回整对象：读→删键→set
                try {
                    const current = await loadCloud(personKey);
                    if (current && typeof current === 'object') delete current[dateStr];
                    await saveCloud(personKey, current || {});
                    return true;
                } catch (e2) {
                    console.error('❌ 退回整对象覆盖也失败:', e2.message || e2);
                    throw e2;
                }
            }
        }

        async function saveCloud(personKey, dataObj) {
            try {
                // 等待 CloudBase 初始化完成
                if (!window.db) {
                    console.warn('⏳ 等待 CloudBase 初始化...');
                    let retries = 0;
                    while (!window.db && retries < 20) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        retries++;
                    }
                    if (!window.db) {
                        throw new Error('CloudBase 初始化超时，请刷新页面重试');
                    }
                }
                
                await window.ready;
                const id = docId(personKey);
                // 注意：不要在 dataToSave 中包含 _id，因为已经在 doc(id) 中指定了文档 ID
                const dataToSave = { personKey, records:dataObj||{}, updatedAtMs: Date.now() };
                console.log('💾 准备保存数据到 CloudBase 文档数据库:', {
                    collection: 'WeightRecord',
                    docId: id,
                    data: dataToSave
                });
                
                // 保存数据（带重试机制）- 根据 CloudBase V2 文档
                // 参考：https://docs.cloudbase.net/api-reference/webv3/database/update
                // 优先使用 update 方法，如果文档不存在则使用 set 方法创建
                let saveResult = null;
                let saveAttempts = 0;
                const MAX_SAVE_ATTEMPTS = 3;
                let useSet = false; // 标记是否使用 set 方法
                
                while (saveAttempts < MAX_SAVE_ATTEMPTS) {
                    try {
                        saveAttempts++;
                        
                        if (!useSet) {
                            // 优先尝试 update 方法（如果文档存在）
                            console.log(`💾 尝试保存数据 (${saveAttempts}/${MAX_SAVE_ATTEMPTS})，使用 update 方法...`);
                            try {
                                // 根据示例：db.collection("WeightRecord").doc("your-doc-name").update({...})
                                saveResult = await window.db.collection('WeightRecord')
                                    .doc(id)
                                    .update({
                                        records: dataToSave.records,
                                        updatedAtMs: dataToSave.updatedAtMs
                                    });
                                
                                console.log('💾 update 操作结果:', saveResult);
                                
                                // 根据 V2 行为：updated>0 代表更新成功；否则视为文档不存在，改用 set
                                if (saveResult && typeof saveResult.updated === 'number') {
                                    if (saveResult.updated > 0) {
                                        console.log('✅ update 操作成功');
                                        break;
                                    } else {
                                        console.log('📝 update 返回 updated: 0，文档可能不存在，改用 set 创建');
                                        useSet = true;
                                        // 继续到 set 分支
                                    }
                                } else {
                                    // 未返回 updated 字段，保守起见尝试 set
                                    console.log('ℹ️ update 返回无 updated 字段，改用 set 创建');
                                    useSet = true;
                                }
                            } catch(updateError) {
                                const errorMsg = updateError.message || String(updateError);
                                console.warn('⚠️ update 失败:', errorMsg);
                                
                                // 如果错误是文档不存在，改用 set 方法创建
                                if (errorMsg.includes('not found') || 
                                    errorMsg.includes('不存在') || 
                                    errorMsg.includes('does not exist') ||
                                    errorMsg.includes('未找到')) {
                                    console.log('📝 文档不存在，改用 set 方法创建...');
                                    useSet = true;
                                    // 继续到 set 逻辑
                                } else {
                                    // 其他错误，重试 update
                                    if (saveAttempts < MAX_SAVE_ATTEMPTS) {
                                        await new Promise(resolve => setTimeout(resolve, 1000));
                                        continue;
                                    } else {
                                        throw updateError;
                                    }
                                }
                            }
                        }
                        
                        // 使用 set 方法创建新文档（文档不存在时）
                        if (useSet) {
                            console.log(`💾 尝试保存数据 (${saveAttempts}/${MAX_SAVE_ATTEMPTS})，使用 set 方法创建文档...`);
                            saveResult = await window.db.collection('WeightRecord').doc(id).set(dataToSave);
                            console.log('💾 set 操作结果:', saveResult);
                            
                            // 检查 set 操作结果
                            if (saveResult && saveResult.code) {
                                const errorCode = saveResult.code;
                                const errorMsg = saveResult.message || '';
                                // 如果有错误码，继续到错误处理
                                if (errorCode === 'DATABASE_REQUEST_FAILED' || 
                                    errorCode === 'FAILED' ||
                                    errorMsg.includes('error') || 
                                    errorMsg.includes('Error') || 
                                    errorMsg.includes('failed') || 
                                    errorMsg.includes('失败')) {
                                    if (saveAttempts < MAX_SAVE_ATTEMPTS) {
                                        console.warn(`⚠️ set 失败 (${errorCode})，${errorMsg}`);
                                        console.log(`🔄 等待 ${saveAttempts * 1000}ms 后重试...`);
                                        await new Promise(resolve => setTimeout(resolve, saveAttempts * 1000));
                                        continue; // 重试
                                    } else {
                                        throw new Error(`保存失败: ${errorCode} - ${errorMsg}`);
                                    }
                                }
                            }
                            
                            // set 成功
                            console.log('✅ set 操作成功（创建新文档）');
                            break;
                        }
                        
                        // 如果执行到这里，说明 update 成功了（因为 set 会 break）
                        // update 成功，保存完成
                        break;
                    } catch(e) {
                        const errorMsg = e.message || String(e);
                        
                        // 如果是网络错误或数据库请求失败，尝试重试
                        if ((errorMsg.includes('DATABASE_REQUEST_FAILED') || 
                             errorMsg.includes('network') || 
                             errorMsg.includes('timeout')) && 
                            saveAttempts < MAX_SAVE_ATTEMPTS) {
                            console.warn(`⚠️ 保存失败: ${errorMsg}`);
                            console.log(`🔄 等待 ${saveAttempts * 1000}ms 后重试...`);
                            await new Promise(resolve => setTimeout(resolve, saveAttempts * 1000));
                            continue; // 重试
                        } else {
                            // 其他错误或重试次数用完，抛出错误
                            throw e;
                        }
                    }
                }
                
                // 检查最终保存结果
                if (!saveResult) {
                    console.warn('⚠️ 保存结果为空，可能保存失败');
                    // 不抛出错误，因为某些情况下 saveResult 可能为 null 但保存已成功
                } else if (saveResult && saveResult.code) {
                    const errorCode = saveResult.code;
                    const errorMsg = saveResult.message || '';
                    
                    // 检查是否是明确的错误
                    if (errorCode === 'DATABASE_REQUEST_FAILED' || 
                        errorCode === 'FAILED' ||
                        errorMsg.includes('error') || 
                        errorMsg.includes('Error') || 
                        errorMsg.includes('failed') || 
                        errorMsg.includes('失败')) {
                        console.error('❌ 保存明确失败:', errorCode, errorMsg);
                        throw new Error(`保存失败: ${errorCode} - ${errorMsg}`);
                    } else {
                        console.log('✅ 保存操作完成，返回码:', errorCode);
                    }
                } else {
                    // 没有 code 字段，可能表示成功
                    console.log('✅ 保存操作完成（无错误码）');
                }
                
                // 验证：保存后立即读取验证，确保数据真正保存了
                try {
                    await new Promise(resolve => setTimeout(resolve, 800)); // 等待 800ms 确保数据写入
                    const verifyResult = await window.db.collection('WeightRecord').doc(id).get();
                    console.log('🔍 验证读取结果:', verifyResult);
                    
                    if (verifyResult && verifyResult.data && verifyResult.data.length > 0) {
                        const savedData = verifyResult.data[0];
                        const savedRecords = savedData.records || {};
                        
                        // 检查保存的数据是否包含我们期望的数据
                        const expectedRecords = dataToSave.records || {};
                        const allKeysMatch = Object.keys(expectedRecords).every(key => 
                            String(savedRecords[key]) === String(expectedRecords[key])
                        );
                        
                        if (allKeysMatch && Object.keys(savedRecords).length >= Object.keys(expectedRecords).length) {
                            console.log('✅ 保存成功并验证通过！', personKey, id);
                            console.log('📊 已保存的数据:', savedData);
                        } else {
                            console.warn('⚠️ 验证发现数据不一致！');
                            console.warn('   期望的数据:', expectedRecords);
                            console.warn('   实际的数据:', savedRecords);
                            
                            // 如果数据不一致，尝试再次保存（使用 set 方法强制更新）
                            console.log('🔄 检测到数据不一致，尝试再次保存...');
                            try {
                                // 使用 set 方法强制更新（set 可以更新或创建文档）
                                await window.db.collection('WeightRecord').doc(id).set(dataToSave);
                                console.log('✅ 强制更新成功');
                            } catch(retryError) {
                                console.error('❌ 强制更新失败:', retryError);
                            }
                        }
                    } else {
                        console.warn('⚠️ 保存操作完成，但验证读取失败（可能是权限问题）：');
                        console.warn('   1. 集合权限不允许匿名用户读取（但写入可能已成功）');
                        console.warn('   2. 数据可能还在写入中（建议稍后刷新页面确认）');
                        console.warn('   3. 可以在 CloudBase 控制台手动检查数据是否已保存');
                        console.log('✅ 保存操作完成（验证失败）', personKey, id);
                    }
                } catch(verifyError) {
                    console.warn('⚠️ 验证读取时出错:', verifyError.message);
                    console.log('✅ 保存操作完成（验证步骤失败，但保存可能已成功）', personKey, id);
                    console.log('💡 建议：在 CloudBase 控制台手动检查数据是否已保存');
                }
            } catch(e) {
                window.lastError = e.message || String(e);
                console.error('❌ 保存失败', personKey, e);
                
                // 提供更详细的错误信息
                let errorMsg = e.message || String(e);
                if (errorMsg.includes('DATABASE_REQUEST_FAILED')) {
                    errorMsg = '数据库请求失败，可能是网络问题或权限问题。请检查：\n1. 网络连接\n2. CloudBase 控制台的权限设置\n3. 集合是否已创建';
                } else if (errorMsg.includes('network') || errorMsg.includes('timeout')) {
                    errorMsg = '网络连接失败，请检查网络后重试';
                }
                
                if (typeof toast === 'function') {
                    toast('保存失败：' + errorMsg);
                }
                throw e; // 重新抛出错误，让调用者知道保存失败
            }
        }

        function subscribeCloud(personKey, cb) {
            if (!window.db) {
                console.error('❌ CloudBase 未初始化，无法订阅');
                return { stop: () => {} };
            }
            const id = docId(personKey);
            console.log('🔍 开始监听体重数据', personKey, id);
            
            // 先等待数据库初始化完成
            (async () => {
                try {
                    await window.ready;
                    
                    // 先查询一次获取最新数据
                    try {
                        const queryResult = await window.db.collection('WeightRecord').doc(id).get();
                        const docs = queryResult.data || [];
                        if (docs.length > 0) {
                            const doc = docs[0];
                            console.log('📥 初始加载体重数据', personKey, doc);
                            cb(doc.records || {});
                        } else {
                            console.log('📥 初始加载：未找到文档，推送空数据以清空界面', personKey);
                            cb({});
                        }
                    } catch(e) {
                        console.warn('⚠️ 初始查询失败', personKey, e);
                    }
                    
                    // 开始监听实时更新（带错误处理和轮询回退）
                    let watchWatcher = null;
                    let pollTimer = null;
                    let watchRetries = 0;
                    const MAX_WATCH_RETRIES = 3;
                    
                    const startPolling = () => {
                        if (pollTimer) return; // 已在轮询中
                        console.log(`🔄 使用轮询方案更新体重数据 ${personKey}（每 5 秒）`);
                        pollTimer = setInterval(async () => {
                            try {
                                const queryResult = await window.db.collection('WeightRecord').doc(id).get();
                                const docs = queryResult.data || [];
                                if (docs.length > 0) {
                                    const doc = docs[0];
                                    console.log('📥 轮询获取体重数据', personKey, doc);
                                    if (doc.records) {
                                        cb(doc.records);
                                    } else if (doc) {
                                        cb(doc);
                                    }
                                } else {
                                    // 文档被删除，推送空对象让界面清空
                                    cb({});
                                }
                            } catch(e) {
                                console.warn('⚠️ 轮询失败', personKey, e);
                            }
                        }, 5000); // 5秒轮询间隔，加快清空同步
                    };
                    
                    const stopPolling = () => {
                        if (pollTimer) {
                            clearInterval(pollTimer);
                            pollTimer = null;
                        }
                    };
                    
                    const tryWatch = () => {
                        try {
                            watchWatcher = window.db.collection('WeightRecord').doc(id).watch({
                                onChange: async snap => {
                                    // watch 成功，但不停止轮询，保持双保险
                                    // 只在确认 watch 稳定工作一段时间后才考虑停止轮询
                                    // CloudBase watch 返回的数据格式可能是 snap.docs 数组或单个文档对象
                                    let doc = null;
                                    if (snap.docs && snap.docs.length > 0) {
                                        doc = snap.docs[0];
                                    } else if (snap.doc) {
                                        doc = snap.doc;
                                    } else if (snap.data) {
                                        doc = snap;
                                    }
                                    
                                    console.log('📢 收到体重数据更新', personKey, doc);
                                    if (doc && doc.records) {
                                        cb(doc.records);
                                    } else if (doc) {
                                        // 可能是整个文档对象
                                        cb(doc);
                                    } else {
                                        // 文档不存在（被删除）
                                        cb({});
                                    }
                                    watchRetries = 0; // 成功，重置重试次数
                                },
                                onError: err => {
                                    window.lastError = err.message || String(err);
                                    console.warn('⚠️ 体重数据 watch 错误, 启动轮询方案:', personKey, err.message || err);
                                    watchRetries++;
                                    
                                    // 停止 watch
                                    if (watchWatcher && watchWatcher.close) {
                                        try {
                                            watchWatcher.close();
                                        } catch(e) {}
                                    }
                                    watchWatcher = null;
                                    
                                    // 立即启动轮询作为备用
                                    startPolling();
                                    
                                    // 如果重试次数未过多，尝试重新连接 watch
                                    if (watchRetries < MAX_WATCH_RETRIES) {
                                        // 延迟后重试 watch
                                        setTimeout(() => {
                                            console.log(`🔄 重试体重数据 watch (${watchRetries}/${MAX_WATCH_RETRIES})... ${personKey}`);
                                            tryWatch();
                                        }, 2000);
                                    } else {
                                        console.log(`🔄 体重数据 watch 重试次数过多，仅使用轮询方案: ${personKey}`);
                                    }
                                }
                            });
                            console.log(`✅ 体重数据 watch 连接成功: ${personKey}`);
                        } catch(e) {
                            console.error('❌ 体重数据 watch 初始化失败:', personKey, e);
                            watchRetries++;
                            if (watchRetries >= MAX_WATCH_RETRIES) {
                                console.log(`🔄 体重数据 watch 初始化失败次数过多，切换到轮询方案: ${personKey}`);
                                startPolling();
                            } else {
                                setTimeout(() => {
                                    console.log(`🔄 重试体重数据 watch (${watchRetries}/${MAX_WATCH_RETRIES})... ${personKey}`);
                                    tryWatch();
                                }, 2000);
                            }
                        }
                    };
                    
                    // 始终启动轮询作为基础保障（即使 watch 成功，轮询也作为备用）
                    // 轮询间隔较长（15秒），不会造成太大负担
                    startPolling();
                    
                    // 尝试启动 watch（作为实时更新的补充）
                    tryWatch();
                    
                    // 如果 watch 在 10 秒内未成功，确保轮询在运行
                    setTimeout(() => {
                        if (!watchWatcher && !pollTimer) {
                            console.log(`🔄 体重数据 watch 连接超时，确保轮询方案运行: ${personKey}`);
                            startPolling();
                        }
                    }, 10000);
                    
                    // 定期检查轮询是否在运行（每30秒检查一次）
                    setInterval(() => {
                        if (!pollTimer && !watchWatcher) {
                            console.log(`🔄 检测到轮询和 watch 都未运行，重新启动轮询: ${personKey}`);
                            startPolling();
                        }
                    }, 30000);
                    
                    return watchWatcher || { stop: () => { stopPolling(); } };
                } catch(e) {
                    console.error('❌ 订阅失败', personKey, e);
                    return { stop: () => {} };
                }
            })();
            
            return { stop: () => {} }; // 返回一个空的 stop 函数，实际停止需要保存 watcher 引用
        }

        window.cloudStorage = { ready: window.ready, load: loadCloud, save: saveCloud, subscribe: subscribeCloud, deleteDate: deleteDateCloud };

        // ===== 在线状态（Presence） =====
        const ROOM_ID = (() => {
            const s = window.START_DATE || new Date('2025-11-03');
            const e = window.END_DATE   || new Date('2026-01-02');
            const pad = n => String(n).padStart(2,'0');
            const f = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
            return `room_${f(s)}_${f(e)}`;
        })();
        const NICK = (() => { const k='presence_nick'; let v=localStorage.getItem(k); if(!v){ v='用户'+Math.floor(Math.random()*900+100); localStorage.setItem(k,v);} return v; })();
        let myPresenceId = null; let heartbeatTimer = null;
        window.myPresence = null;

        async function presenceUp() {
            try {
                // 等待数据库初始化完成
                if (!window.db) {
                    console.warn('⏳ 等待 CloudBase 初始化...');
                    let retries = 0;
                    while (!window.db && retries < 30) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        retries++;
                    }
                    if (!window.db) {
                        console.error('❌ CloudBase 未初始化，无法设置在线状态');
                        return;
                    }
                }
                
                await window.ready;
                const uid = window.auth.currentUser ? window.auth.currentUser.uid : ('anon_'+Math.random().toString(36).slice(2,8));
                const id = `${ROOM_ID}_${uid}`;
                const tab = document.querySelector('.tab-btn.active')?.dataset.target || 'liang';
                
                console.log('👤 设置在线状态:', { id, uid, nick: NICK, tab });
                await window.db.collection('Presence').doc(id).set({ roomId:ROOM_ID, userId:uid, nick:NICK, tab, since:Date.now(), lastSeen:Date.now() });
                myPresenceId = id; 
                window.myPresence = { id };
                console.log('✅ 在线状态设置成功:', myPresenceId);
                
                if (heartbeatTimer) clearInterval(heartbeatTimer);
                heartbeatTimer = setInterval(async ()=>{
                    try { 
                        await window.db.collection('Presence').doc(id).update({ lastSeen: Date.now() }); 
                    } catch(e) {
                        console.warn('心跳更新失败:', e);
                    }
                }, 15000);
            } catch(e) {
                console.error('❌ 设置在线状态失败:', e);
            }
        }

        function presenceRenderFromDocs(docs) {
            const now = Date.now();
            // 超时时间：60 秒 - 移动端退出后更快标记为离线
            const TIMEOUT = 60000;
            const alive = (docs||[]).filter(p => (now - (p.lastSeen||0)) < TIMEOUT);
            const count = alive.length;
            const names = alive.map(p => p.nick || '用户').join('、');
            const cEl = document.getElementById('presenceCount');
            const nEl = document.getElementById('presenceNames');
            if (cEl) cEl.textContent = `${count} 在线`;
            if (nEl) nEl.textContent = names;
            const listEl = document.getElementById('presenceList');
            if (listEl) {
                listEl.innerHTML = '';
                alive.forEach(p => {
                    const item = document.createElement('div'); item.className = 'presence-item';
                    const dur = Math.max(0, Math.floor((now - (p.since||now))/1000));
                    const mm = String(Math.floor(dur/60)).padStart(2,'0'); const ss = String(dur%60).padStart(2,'0');
                    const tabLabel = p.tab==='liang' ? '梁君辉' : (p.tab==='teng' ? '滕浠顺' : (p.tab==='qiao' ? '李乔' : (p.tab==='mu' ? '慕忠伟' : (p.tab||''))));
                    item.innerHTML = `<span class=\"dot\"></span><span>${p.nick||'用户'}</span><span class=\"badge\">${tabLabel}</span><span class=\"muted\">在线 ${mm}:${ss}</span>`;
                    listEl.appendChild(item);
                });
            }
        }

        async function presenceSubscribe() {
            try {
                // 等待数据库初始化完成
                if (!window.db) {
                    console.warn('⏳ 等待 CloudBase 初始化以开始监听...');
                    let retries = 0;
                    while (!window.db && retries < 30) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        retries++;
                    }
                    if (!window.db) {
                        console.error('❌ CloudBase 未初始化，无法监听在线状态');
                        return;
                    }
                }
                
                await window.ready;
                console.log('👂 开始监听在线状态，房间:', ROOM_ID);
                
                // 先查询一次当前数据
                try {
                    const queryResult = await window.db.collection('Presence').where({ roomId: ROOM_ID }).get();
                    const docs = queryResult.data || [];
                    console.log('📊 初始在线状态查询结果:', docs.length, '用户');
                    presenceRenderFromDocs(docs);
                } catch(e) {
                    console.warn('⚠️ 初始查询失败:', e);
                }
                
                // 然后开始监听实时更新（带错误处理和轮询回退）
                let watchWatcher = null;
                let pollTimer = null;
                let watchRetries = 0;
                const MAX_WATCH_RETRIES = 3;
                
                const startPolling = () => {
                    if (pollTimer) return; // 已在轮询中
                    console.log('🔄 使用轮询方案更新在线状态（每 5 秒）');
                    pollTimer = setInterval(async () => {
                        try {
                            const queryResult = await window.db.collection('Presence').where({ roomId: ROOM_ID }).get();
                            const docs = queryResult.data || [];
                            presenceRenderFromDocs(docs);
                        } catch(e) {
                            console.warn('⚠️ 轮询失败:', e);
                        }
                    }, 5000);
                };
                
                const stopPolling = () => {
                    if (pollTimer) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                    }
                };
                
                const tryWatch = () => {
                    try {
                        watchWatcher = window.db.collection('Presence').where({ roomId: ROOM_ID }).watch({
                            onChange: async snap => {
                                stopPolling(); // watch 成功，停止轮询
                                const docs = snap.docs || [];
                                console.log('📢 收到在线状态更新，用户数:', docs.length, docs);
                                
                                // 定期清理超时的在线状态（60 秒未更新则删除）
                                const now = Date.now();
                                const TIMEOUT = 60000;
                                const expiredDocs = docs.filter(p => (now - (p.lastSeen||0)) >= TIMEOUT);
                                
                                if (expiredDocs.length > 0) {
                                    console.log('🧹 清理超时的在线状态:', expiredDocs.length, '个');
                                    for (const doc of expiredDocs) {
                                        try {
                                            if (doc._id || doc.id) {
                                                const docId = doc._id || doc.id;
                                                await window.db.collection('Presence').doc(docId).remove();
                                                console.log('✅ 已删除超时的在线状态:', docId);
                                            }
                                        } catch(e) {
                                            console.warn('⚠️ 删除超时状态失败:', e);
                                        }
                                    }
                                }
                                
                                presenceRenderFromDocs(docs);
                                watchRetries = 0; // 成功，重置重试次数
                            },
                            onError: err => {
                                console.warn('⚠️ presence watch error, 切换到轮询方案:', err.message || err);
                                watchRetries++;
                                
                                // 停止 watch
                                if (watchWatcher && watchWatcher.close) {
                                    try {
                                        watchWatcher.close();
                                    } catch(e) {}
                                }
                                watchWatcher = null;
                                
                                // 如果重试次数过多，切换到轮询
                                if (watchRetries >= MAX_WATCH_RETRIES) {
                                    console.log('🔄 watch 重试次数过多，切换到轮询方案');
                                    startPolling();
                                } else {
                                    // 延迟后重试 watch
                                    setTimeout(() => {
                                        console.log(`🔄 重试 watch (${watchRetries}/${MAX_WATCH_RETRIES})...`);
                                        tryWatch();
                                    }, 2000);
                                }
                            }
                        });
                        console.log('✅ watch 连接成功');
                    } catch(e) {
                        console.error('❌ watch 初始化失败:', e);
                        watchRetries++;
                        if (watchRetries >= MAX_WATCH_RETRIES) {
                            console.log('🔄 watch 初始化失败次数过多，切换到轮询方案');
                            startPolling();
                        } else {
                            setTimeout(() => {
                                console.log(`🔄 重试 watch (${watchRetries}/${MAX_WATCH_RETRIES})...`);
                                tryWatch();
                            }, 2000);
                        }
                    }
                };
                
                // 尝试启动 watch
                tryWatch();
                
                // 如果 watch 在 10 秒内未成功，启动轮询作为备用
                setTimeout(() => {
                    if (!watchWatcher && !pollTimer) {
                        console.log('🔄 watch 连接超时，启动轮询方案');
                        startPolling();
                    }
                }, 10000);
            } catch(e) {
                console.error('❌ 监听在线状态失败:', e);
            }
        }

        window.updatePresenceTab = async function(key){ 
            try { 
                if (myPresenceId && window.db) {
                    await window.db.collection('Presence').doc(myPresenceId).update({ tab: key, lastSeen: Date.now() }); 
                }
            } catch(e) {
                console.warn('更新标签失败:', e);
            }
        };

        // 删除在线状态（关闭页面时调用）
        async function removePresence() {
            if (!myPresenceId || !window.db) return;
            try {
                console.log('👋 删除在线状态:', myPresenceId);
                await window.db.collection('Presence').doc(myPresenceId).remove();
                console.log('✅ 在线状态已删除');
            } catch(e) {
                console.warn('❌ 删除在线状态失败:', e);
            }
        }

        // 使用多种方式处理页面显示/隐藏和关闭
        // 方法1: visibilitychange - 当页面隐藏/显示时（切换标签、最小化窗口等）
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'hidden') {
                // 页面隐藏时，更新一次 lastSeen，然后停止心跳（但不删除在线状态）
                if (myPresenceId && window.db) {
                    try {
                        // 更新最后一次活动时间，这样可以给一个缓冲期
                        window.ready.then(async () => {
                            const tab = document.querySelector('.tab-btn.active')?.dataset.target || 'liang';
                            await window.db.collection('Presence').doc(myPresenceId).update({ 
                                lastSeen: Date.now(),
                                tab: tab
                            });
                            console.log('⏸️ 页面隐藏，已更新最后活动时间，停止心跳');
                        });
                    } catch(e) {
                        console.warn('更新最后活动时间失败:', e);
                    }
                }
                
                // 停止心跳
                if (heartbeatTimer) {
                    clearInterval(heartbeatTimer);
                    heartbeatTimer = null;
                }
            } else if (document.visibilityState === 'visible') {
                // 页面显示时，立即更新 lastSeen 并恢复心跳
                if (myPresenceId && window.db) {
                    try {
                        console.log('▶️ 页面显示，恢复在线状态');
                        await window.ready;
                        const tab = document.querySelector('.tab-btn.active')?.dataset.target || 'liang';
                        // 立即更新 lastSeen
                        await window.db.collection('Presence').doc(myPresenceId).update({ 
                            lastSeen: Date.now(),
                            tab: tab
                        });
                        // 恢复心跳
                        if (!heartbeatTimer) {
                            heartbeatTimer = setInterval(async () => {
                                try {
                                    if (myPresenceId && window.db) {
                                        const currentTab = document.querySelector('.tab-btn.active')?.dataset.target || 'liang';
                                        await window.db.collection('Presence').doc(myPresenceId).update({ 
                                            lastSeen: Date.now(),
                                            tab: currentTab
                                        });
                                    }
                                } catch(e) {
                                    console.warn('心跳更新失败:', e);
                                }
                            }, 20000);
                        }
                    } catch(e) {
                        console.warn('⚠️ 恢复在线状态失败:', e);
                    }
                }
            }
        });

        // 方法2: beforeunload - 页面卸载前（可能来不及执行异步操作）
        window.addEventListener('beforeunload', () => {
            // beforeunload 中异步操作可能无法完成，使用同步方式尝试
            if (myPresenceId && window.db) {
                // 尝试同步删除（如果可能）
                try {
                    // 注意：这可能在页面关闭前无法完成，但至少尝试了
                    window.db.collection('Presence').doc(myPresenceId).remove().catch(() => {});
                } catch(e) {}
            }
        });

        // 方法3: pagehide - 页面隐藏时（比 beforeunload 更可靠）
        window.addEventListener('pagehide', () => {
            removePresence();
        });

        // 启动在线状态功能（等待数据库初始化完成）
        (async () => {
            try {
                await window.ready;
                console.log('🚀 初始化在线状态功能...');
                await presenceUp();
                await presenceSubscribe();
            } catch(e) {
                console.error('❌ 初始化在线状态失败:', e);
            }
        })();

        // 昵称编辑
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('nickInput');
            if (input) {
                try { input.value = localStorage.getItem('presence_nick') || ''; } catch(e) {}
                input.addEventListener('change', async () => {
                    const v = input.value.trim() || '用户' + Math.floor(Math.random()*900+100);
                    localStorage.setItem('presence_nick', v);
                    try { 
                        if (myPresenceId && window.db) {
                            console.log('✏️ 更新昵称:', v, 'presenceId:', myPresenceId);
                            await window.db.collection('Presence').doc(myPresenceId).update({ nick: v, lastSeen: Date.now() });
                            console.log('✅ 昵称更新成功');
                        } else {
                            console.warn('⚠️ 无法更新昵称: myPresenceId=', myPresenceId, 'window.db=', !!window.db);
                        }
                    } catch(e) {
                        console.error('❌ 昵称更新失败:', e);
                    }
                });
            }
            const toggle = document.getElementById('presenceToggle');
            const panel = document.getElementById('presencePanel');
            const close = document.getElementById('presenceClose');
            if (toggle && panel) toggle.addEventListener('click', () => panel.classList.toggle('show'));
            if (close && panel) close.addEventListener('click', () => panel.classList.remove('show'));
        });
    </script>
</body>
